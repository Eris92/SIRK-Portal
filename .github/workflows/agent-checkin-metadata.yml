name: Temporary Agent check-in metadata validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/trigger-agent-checkin-metadata.txt

permissions:
  contents: write

jobs:
  agent-checkin-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Apply Agent check-in metadata fix
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/agent-checkin-metadata
          git show origin/fix/agent-checkin-metadata:.github/scripts/apply-agent-checkin-metadata.py > .github/scripts/apply-agent-checkin-metadata.py
          python3 .github/scripts/apply-agent-checkin-metadata.py
      - name: Validate compact metadata contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'JsonSerializer.Serialize(value.Value, JsonOptions)' src/Sirk.Portal/Agent/LegacyAgentCompatibilityEndpoints.cs
          ! grep -A6 -F 'static string Summarize' src/Sirk.Portal/Agent/LegacyAgentCompatibilityEndpoints.cs | grep -Fq 'GetRawText()'
          grep -Fq 'Legacy Agent check-in metadata must be serialized as compact JSON.' tests/Sirk.Portal.ProtocolTests/Program.cs
      - name: Build publish and test .NET 10 Portal
        shell: bash
        run: bash .github/scripts/validate-node-free-dotnet10.sh
      - name: Commit final Agent check-in fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-checkin-metadata.yml
          rm -f .github/scripts/apply-agent-checkin-metadata.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: compact legacy Agent check-in metadata'
          git push origin HEAD:main
