name: Fix Filesystem Contract Marker

on:
  push:
    branches: [ fix/test-blockers-management-settings-agent ]
    paths: [ '.github/workflows/fix-filesystem-contract-marker.yml' ]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/test-blockers-management-settings-agent
      - name: Fix marker and commit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/validate-node-free-dotnet10.sh')
          value = path.read_text(encoding='utf-8')
          old = "for marker in ('VariableRequired', 'Files', 'ScriptStore.HashDefinition'):"
          new = "for marker in ('VariableHeader', 'Required|Switch|Select', 'ScriptStore.HashDefinition'):"
          if value.count(old) != 1:
              raise SystemExit('Expected parser marker was not found exactly once.')
          path.write_text(value.replace(old, new), encoding='utf-8', newline='\n')
          PY
          rm -f .github/workflows/fix-filesystem-contract-marker.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Fix filesystem parser contract marker'
          git push origin HEAD:fix/test-blockers-management-settings-agent
