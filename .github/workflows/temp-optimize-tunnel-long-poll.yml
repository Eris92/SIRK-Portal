name: Temporary Portal long-poll optimization

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply active polling and higher concurrency
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def block(lines):
              return "\n".join(lines)

          path = Path("src/Sirk.Portal/Central/CentralTunnelService.cs")
          text = path.read_text(encoding="utf-8")

          options_old = block([
              "    public int PollIntervalMilliseconds { get; init; } = 750;",
              "    public int MaximumConcurrency { get; init; } = 8;",
          ])
          options_new = block([
              "    public int PollIntervalMilliseconds { get; init; } = 100;",
              "    public int MaximumConcurrency { get; init; } = 32;",
          ])
          if text.count(options_old) != 1:
              raise SystemExit(f"Expected one tunnel options block, found {text.count(options_old)}.")
          text = text.replace(options_old, options_new, 1)

          loop_old = block([
              "        while (!stoppingToken.IsCancellationRequested)",
              "        {",
              "            var delay = Math.Clamp(_options.PollIntervalMilliseconds, 250, 10_000);",
              "            try",
          ])
          loop_new = block([
              "        while (!stoppingToken.IsCancellationRequested)",
              "        {",
              "            var delay = Math.Clamp(_options.PollIntervalMilliseconds, 50, 10_000);",
              "            var shouldDelay = true;",
              "            try",
          ])
          if text.count(loop_old) != 1:
              raise SystemExit(f"Expected one polling loop header, found {text.count(loop_old)}.")
          text = text.replace(loop_old, loop_new, 1)

          requests_old = block([
              "                var requests = await PollAsync(resolved.Options, stoppingToken);",
              "                foreach (var request in requests)",
          ])
          requests_new = block([
              "                var requests = await PollAsync(resolved.Options, stoppingToken);",
              "                shouldDelay = requests.Count == 0;",
              "                foreach (var request in requests)",
          ])
          if text.count(requests_old) != 1:
              raise SystemExit(f"Expected one request dispatch block, found {text.count(requests_old)}.")
          text = text.replace(requests_old, requests_new, 1)

          delay_old = block([
              "            try",
              "            {",
              "                await Task.Delay(TimeSpan.FromMilliseconds(delay), stoppingToken);",
              "            }",
              "            catch (OperationCanceledException) when (stoppingToken.IsCancellationRequested)",
              "            {",
              "                break;",
              "            }",
          ])
          delay_new = block([
              "            if (!shouldDelay) continue;",
              "",
              "            try",
              "            {",
              "                await Task.Delay(TimeSpan.FromMilliseconds(delay), stoppingToken);",
              "            }",
              "            catch (OperationCanceledException) when (stoppingToken.IsCancellationRequested)",
              "            {",
              "                break;",
              "            }",
          ])
          if text.count(delay_old) != 1:
              raise SystemExit(f"Expected one polling delay block, found {text.count(delay_old)}.")
          text = text.replace(delay_old, delay_new, 1)

          path.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Build Portal
        run: dotnet build src/Sirk.Portal/Sirk.Portal.csproj -c Release --nologo

      - name: Commit final fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-optimize-tunnel-long-poll.yml
          git add src/Sirk.Portal/Central/CentralTunnelService.cs
          git commit -m "perf: drain Portal tunnel without idle polling delays"
          git push origin HEAD:main
