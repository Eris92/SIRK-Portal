name: One-shot GUI updater and Central tunnel fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.event.pull_request.head.ref == 'fix/gui-update-central-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Apply product fix
        run: python3 tools/maintenance/apply-gui-update-tunnel-fix.py
      - name: Validate JavaScript
        run: node --check public/portal/standalone/scripts/settings-native-v2.js
      - name: Validate protocol contracts
        run: dotnet run --project tests/Sirk.Portal.ProtocolTests/Sirk.Portal.ProtocolTests.csproj --configuration Release
      - name: Build Portal
        run: dotnet build src/Sirk.Portal/Sirk.Portal.csproj --configuration Release --no-restore
      - name: Commit validated fix to PR branch
        shell: bash
        run: |
          rm -f tools/maintenance/apply-gui-update-tunnel-fix.py
          rm -f .github/workflows/one-shot-gui-update-tunnel-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(maintenance): enable GUI updates and loopback Central tunnel"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
