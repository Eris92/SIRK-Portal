name: Apply workspace layout v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-workspace-layout-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Apply redesign
        run: python3 .github/scripts/workspace-layout-v2-run.py
      - name: Validate JavaScript
        run: node --check public/portal/standalone/scripts/device-workspace.js && node --check public/portal/standalone/scripts/device-tabs.js && node --check public/portal/standalone/scripts/workspace-connection.js
      - name: Validate contracts
        run: dotnet run --project tests/Sirk.Portal.ProtocolTests/Sirk.Portal.ProtocolTests.csproj --configuration Release
      - name: Commit
        run: |
          rm -f .github/workflows/one-shot-workspace-layout-v2.yml
          rm -f .github/scripts/workspace-layout-v2.py
          rm -f .github/scripts/workspace-layout-v2-post.py
          rm -f .github/scripts/workspace-layout-v2-run.py
          git diff --check
          git config user.name 'SIRK Automation'
          git config user.email 'sirk-automation@users.noreply.github.com'
          git add -A
          git commit -m 'feat(ui): reorganize device workspace controls'
          git push origin HEAD:main
