name: Apply workspace layout v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-workspace-layout-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Prepare patch script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/workspace-layout-v2.py')
          source = path.read_text(encoding='utf-8')
          start = source.index("new_layout = r'''")
          end = source.index("\n'''\npattern = re.compile", start)
          block = source[start:end].replace('\\"', '"')
          source = source[:start] + block + source[end:]
          source = source.replace(
              'pattern.subn(new_layout, workspace, count=1)',
              'pattern.subn(lambda _match: new_layout, workspace, count=1)')
          path.write_text(source, encoding='utf-8')
          PY

      - name: Apply workspace redesign
        run: python3 .github/scripts/workspace-layout-v2.py

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          node --check public/portal/standalone/scripts/device-workspace.js
          node --check public/portal/standalone/scripts/device-tabs.js
          node --check public/portal/standalone/scripts/workspace-connection.js

      - name: Validate Portal contracts
        run: dotnet run --project tests/Sirk.Portal.ProtocolTests/Sirk.Portal.ProtocolTests.csproj --configuration Release

      - name: Commit validated redesign
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-workspace-layout-v2.yml
          rm -f .github/scripts/workspace-layout-v2.py
          git diff --check
          git config user.name 'SIRK Automation'
          git config user.email 'sirk-automation@users.noreply.github.com'
          git add -A
          git commit -m 'feat(ui): reorganize device workspace controls'
          git push origin HEAD:main
