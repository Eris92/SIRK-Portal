name: Apply canonical Agent key rotation

on:
  push:
    branches:
      - feat/canonical-agent-management-v1

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canonical-agent-management-v1
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Apply canonical key rotation
        shell: pwsh
        run: python .github/scripts/apply_canonical_agent_rotate_key.py
      - name: Build and test Portal
        shell: pwsh
        run: |
          dotnet restore src/Sirk.Portal/Sirk.Portal.csproj
          dotnet build src/Sirk.Portal/Sirk.Portal.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Portal build failed.' }
          dotnet run --project tests/Sirk.Portal.ProtocolTests/Sirk.Portal.ProtocolTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Portal protocol contracts failed.' }
      - name: Commit product change
        shell: pwsh
        run: |
          Remove-Item .github/workflows/apply-canonical-agent-rotate-key.yml -Force
          Remove-Item .github/scripts/apply_canonical_agent_rotate_key.py -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add canonical Agent device key rotation'
          git push origin HEAD:feat/canonical-agent-management-v1
