name: Temporary native Agent installer panel

on:
  pull_request:
    branches: [main]
    paths:
      - .github/trigger-native-agent-installer.txt

permissions:
  contents: write

jobs:
  native-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Apply native Agent installer panel
        run: python3 .github/scripts/apply-native-agent-installer.py
      - name: Validate installer integration
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'renderAgentInstaller(node);' public/portal/standalone/scripts/settings-native-v2.js
          grep -Fq 'portalApiPath("admin/agent-groups/' public/portal/standalone/scripts/settings-native-v2.js
          grep -Fq 'native-agent-installer-20260804-1' src/Sirk.Portal/Ui/PortalUiEndpoints.cs
          ! grep -Fq 'agent-installer-ui.js' src/Sirk.Portal/Ui/PortalUiEndpoints.cs
          test ! -e public/portal/standalone/scripts/agent-installer-ui.js
      - name: Build publish and test .NET 10 Portal
        shell: bash
        run: bash .github/scripts/validate-node-free-dotnet10.sh
      - name: Commit final native installer panel
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/apply-native-agent-installer.py
          rm -f .github/workflows/native-agent-installer.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: render Agent installer directly in computer groups'
          git push origin HEAD:main
