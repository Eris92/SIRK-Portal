name: SIRK Portal Binary Clean Install

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'install.ps1'
      - 'install-core.ps1'
      - 'install-binary.ps1'
      - '.github/workflows/portal-binary-install-ci.yml'
      - 'tools/installer/Ensure-SirkUpdater.ps1'
      - 'tests/binary-install-contract.ps1'

permissions:
  contents: read

concurrency:
  group: portal-binary-clean-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-binary-clean-install:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Validate Windows PowerShell 5.1 syntax
        shell: powershell
        run: |
          foreach ($path in @('.\install.ps1','.\install-core.ps1','.\install-binary.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "$path contains PowerShell syntax errors."
            }
          }

      - name: Run binary installer contract
        shell: powershell
        run: .\tests\binary-install-contract.ps1

      - name: Verify immutable preview release discovery on Windows PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Accept = 'application/vnd.github+json'; 'User-Agent' = 'SIRK-Portal-Bootstrap-CI' }
          $response = Invoke-WebRequest -UseBasicParsing -Headers $headers -Uri 'https://api.github.com/repos/Eris92/SIRK-Portal/releases?per_page=50'
          $parsed = ConvertFrom-Json -InputObject $response.Content
          $releases = @()
          if ($parsed -is [System.Array]) {
            foreach ($item in $parsed) { $releases += $item }
          } else {
            $releases += $parsed
          }
          Write-Host "release-count=$($releases.Count) parsed-type=$($parsed.GetType().FullName)"
          $matchedTags = @()
          foreach ($release in $releases) {
            $tag = [string]$release.tag_name
            $assetNames = @($release.assets | ForEach-Object { [string]$_.name })
            $tagOk = $tag -match '^v(0\.1\.1\.\d+)$'
            $versionText = if ($tagOk) { $Matches[1] } else { '' }
            $descriptor = if ($versionText) { "SIRK-Portal-$versionText-win-x64.update.json" } else { '' }
            $package = if ($versionText) { "SIRK-Portal-$versionText-win-x64.zip" } else { '' }
            $assetOk = $versionText -and ($assetNames -contains $descriptor) -and ($assetNames -contains $package) -and ($assetNames -contains 'release-trusted-keys.json')
            Write-Host "tag=$tag draft=$($release.draft) prerelease=$($release.prerelease) tagOk=$tagOk assetsOk=$assetOk"
            if (-not $release.draft -and $release.prerelease -and $tagOk -and $assetOk) { $matchedTags += $tag }
          }
          if ($matchedTags.Count -lt 1) { throw 'Windows PowerShell could not discover any immutable signed preview Portal release.' }
          Write-Host ('SIRK_PORTAL_WINDOWS_RELEASE_DISCOVERY_OK ' + ($matchedTags -join ',')) -ForegroundColor Green

      - name: Clean install through canonical router
        shell: powershell
        env:
          SIRK_INSTALL_BREAKGLASS_PASSWORD: 'CI-Portal-BreakGlass-2026!'
          SIRK_INSTALL_TRUST_CERTIFICATE: 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          .\install.ps1 `
            -Branch main `
            -Channel preview `
            -PortalFqdn 'portal-ci.sir-k.local' `
            -HttpsPort 443 `
            -BootstrapUserName 'admin' `
            -TrustCertificate `
            -NonInteractive

      - name: Verify installed Portal and updater
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $portal = Get-Service SirkPortal -ErrorAction Stop
          $updater = Get-Service SirkUpdater -ErrorAction Stop
          if ($portal.Status -ne 'Running' -or $portal.StartType -ne 'Automatic') {
            throw "Invalid SirkPortal state: $($portal.Status) / $($portal.StartType)"
          }
          if ($updater.Status -ne 'Running') {
            throw "Invalid SirkUpdater state: $($updater.Status)"
          }

          $health = Invoke-RestMethod -Uri 'https://portal-ci.sir-k.local/healthz'
          $ready = Invoke-RestMethod -Uri 'https://portal-ci.sir-k.local/readyz'
          if ($health.status -ne 'healthy') { throw 'healthz failed.' }
          if ($ready.status -ne 'ready') { throw 'readyz failed.' }

          $manifest = Get-Content 'C:\Program Files\SIRK\Portal\release-manifest.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($manifest.applicationId -ne 'sirk-portal' -or $manifest.runtime -ne 'win-x64') {
            throw 'Installed release manifest is invalid.'
          }
          if (-not (Test-Path 'C:\Program Files\SIRK\Portal\release-trusted-keys.json')) {
            throw 'Installed release trust root is missing.'
          }
          $updaterManifest = Get-Content 'C:\ProgramData\SIRK\Updater\applications\sirk-portal.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($updaterManifest.updateSource -ne 'sirk-central-cache' -or $updaterManifest.signatureRequired -ne $true) {
            throw 'Portal Updater registration is not Central-only and fail-closed.'
          }
          if (-not (Test-Path 'C:\ProgramData\SIRK\Portal\identity.json')) {
            throw 'Portal identity was not initialized.'
          }
          if (Test-Path 'C:\ProgramData\SIRK\Build Cache\dotnet-sdk') {
            throw 'Binary clean installation must not download a build SDK.'
          }

          Write-Host ('Canonical binary clean install verified. Commit=' + $manifest.commit) -ForegroundColor Green
