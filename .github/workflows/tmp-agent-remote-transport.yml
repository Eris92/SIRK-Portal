name: Temporary Agent remote transport compatibility

on:
  pull_request:
    paths:
      - '.github/triggers/agent-remote-transport.txt'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply compatibility patch
        run: python3 .github/scripts/apply-agent-remote-transport.py

      - name: Validate transport contracts
        shell: bash
        run: |
          grep -F 'MapPost("/api/agent-operations"' src/Sirk.Portal/Ui/PortalUiCompatibilityEndpoints.cs
          grep -F 'MapGet("/api/agent-desktop/frame"' src/Sirk.Portal/Ui/PortalUiCompatibilityEndpoints.cs
          grep -F 'MapGet("/api/agent/v1/desktop/stream"' src/Sirk.Portal/Agent/LegacyAgentCompatibilityEndpoints.cs
          grep -F 'MapPost("/api/agent/v1/desktop/control"' src/Sirk.Portal/Agent/LegacyAgentCompatibilityEndpoints.cs
          grep -F '"desktop.sessions" => "desktop.sessions"' src/Sirk.Portal/Agent/LegacyAgentCompatibilityEndpoints.cs
          grep -F 'deviceId = device.GetProperty("id")' src/Sirk.Portal/Ui/PortalUiCompatibilityEndpoints.cs
          grep -F 'usesHttpTunnel()' public/portal/standalone/scripts/device-workspace.js
          grep -F '"/api/v1/desktop/stream?deviceId="' public/portal/standalone/scripts/device-workspace.js
          ! grep -F '"/api/agent-desktop/stream?' public/portal/standalone/scripts/device-workspace.js
          ! grep -F '"/api/agent-desktop/input-stream?' public/portal/standalone/scripts/device-workspace.js

      - name: Validate Node-free .NET 10 Portal
        run: bash .github/scripts/validate-node-free-dotnet10.sh

      - name: Commit product fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-agent-remote-transport.yml .github/scripts/apply-agent-remote-transport.py
          git add src/Sirk.Portal/Agent/DesktopRelayHub.cs \
                  src/Sirk.Portal/Agent/LegacyAgentCompatibilityEndpoints.cs \
                  src/Sirk.Portal/Agent/AgentCommandStore.cs \
                  src/Sirk.Portal/Agent/AgentEndpoints.cs \
                  src/Sirk.Portal/Ui/PortalUiCompatibilityEndpoints.cs \
                  src/Sirk.Portal/Ui/PortalUiEndpoints.cs \
                  public/portal/standalone/scripts/device-workspace.js
          git commit -m 'fix: restore Agent operations and tunneled desktop transport'
          git push origin HEAD:main
