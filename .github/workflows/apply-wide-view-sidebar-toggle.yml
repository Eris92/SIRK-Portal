name: Apply Wide View Sidebar Toggle

on:
  push:
    branches:
      - fix/wide-view-sidebar-toggle
    paths:
      - .github/scripts/apply-wide-view-sidebar-toggle.py
      - .github/workflows/apply-wide-view-sidebar-toggle.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wide-view-sidebar-toggle
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply menu toggle fix
        run: python .github/scripts/apply-wide-view-sidebar-toggle.py
      - name: Validate browser JavaScript
        run: node --check public/portal/standalone/scripts/view-mode.js
      - name: Validate complete Portal contracts
        run: dotnet run --project tests/Sirk.Portal.ProtocolTests/Sirk.Portal.ProtocolTests.csproj --configuration Release
      - name: Remove migration helpers
        run: rm -f .github/scripts/apply-wide-view-sidebar-toggle.py .github/workflows/apply-wide-view-sidebar-toggle.yml
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/portal/standalone/scripts/view-mode.js \
                  tests/Sirk.Portal.ProtocolTests/DeviceConnectionWorkspaceContract.cs \
                  .github/scripts/apply-wide-view-sidebar-toggle.py \
                  .github/workflows/apply-wide-view-sidebar-toggle.yml
          git commit -m "fix(ui): show sidebar toggle in wide Devices view"
          git push origin HEAD:fix/wide-view-sidebar-toggle
