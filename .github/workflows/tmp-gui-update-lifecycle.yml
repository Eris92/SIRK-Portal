name: Temporary GUI updater lifecycle repair

on:
  push:
    paths:
      - '.github/triggers/gui-update-lifecycle.txt'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply product repair
        run: python3 .github/scripts/apply-gui-update-lifecycle.py

      - name: Validate JavaScript syntax
        run: node --check public/portal/standalone/scripts/settings-native-v2.js

      - name: Run protocol contracts
        run: dotnet run --project tests/Sirk.Portal.ProtocolTests/Sirk.Portal.ProtocolTests.csproj --configuration Release

      - name: Commit product repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-gui-update-lifecycle.yml \
                 .github/scripts/apply-gui-update-lifecycle.py \
                 .github/triggers/gui-update-lifecycle.txt
          git add src/Sirk.Portal/Maintenance/PortalMaintenanceEndpoints.cs \
                  public/portal/standalone/scripts/settings-native-v2.js \
                  tests/Sirk.Portal.ProtocolTests/GuiUpdaterLifecycleContract.cs
          git commit -m 'fix(maintenance): track GUI updater lifecycle'
          git push origin HEAD:main
