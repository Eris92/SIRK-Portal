name: Apply canonical Agent management v1

on:
  push:
    branches:
      - feat/canonical-agent-management-v1

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canonical-agent-management-v1
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Apply canonical management transport
        shell: pwsh
        run: python .github/scripts/apply_canonical_agent_management_v1.py
      - name: Restore and build Portal
        shell: pwsh
        run: |
          dotnet restore src/Sirk.Portal/Sirk.Portal.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Portal restore failed.' }
          dotnet build src/Sirk.Portal/Sirk.Portal.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Portal build failed.' }
      - name: Run protocol contracts
        shell: pwsh
        run: |
          dotnet run --project tests/Sirk.Portal.ProtocolTests/Sirk.Portal.ProtocolTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Portal protocol contracts failed.' }
      - name: Validate route removal
        shell: pwsh
        run: |
          $legacy = Get-ChildItem src,public -Recurse -File | Select-String -SimpleMatch '/api/agent/v1/'
          if ($legacy) {
            $legacy | ForEach-Object { Write-Error $_ }
            throw 'Legacy Agent v1 route remains.'
          }
          if (Test-Path src/Sirk.Portal/Agent/LegacyAgentCompatibilityEndpoints.cs) {
            throw 'Legacy Agent compatibility source remains.'
          }
      - name: Commit product changes
        shell: pwsh
        run: |
          Remove-Item .github/workflows/apply-canonical-agent-management-v1.yml -Force
          Remove-Item .github/scripts/apply_canonical_agent_management_v1.py -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add canonical signed Agent management v1'
          git push origin HEAD:feat/canonical-agent-management-v1
