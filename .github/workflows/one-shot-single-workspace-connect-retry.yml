name: Retry single workspace connection

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-single-workspace-connect-retry.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ contains(github.event.head_commit.message, '[retry-single-workspace-connect]') }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Apply single workspace connection model
        shell: pwsh
        run: |
          $workflow = Get-Content '.github/workflows/one-shot-single-workspace-connect.yml' -Raw
          $match = [regex]::Match($workflow, "echo '([^']+)' \| base64 -d")
          if (-not $match.Success) { throw 'Encoded patch was not found.' }
          $encoded = $match.Groups[1].Value
          $gzipPath = Join-Path $env:TEMP 'sirk-patch.py.gz'
          $patchPath = Join-Path $env:TEMP 'sirk-patch.py'
          [IO.File]::WriteAllBytes($gzipPath, [Convert]::FromBase64String($encoded))
          python -c "import gzip,pathlib; pathlib.Path(r'$patchPath').write_bytes(gzip.decompress(pathlib.Path(r'$gzipPath').read_bytes()))"
          python $patchPath
      - name: Validate Portal contracts
        shell: pwsh
        run: dotnet run --project tests/Sirk.Portal.ProtocolTests/Sirk.Portal.ProtocolTests.csproj --configuration Release
      - name: Commit validated connection model
        shell: pwsh
        run: |
          Remove-Item '.github/workflows/one-shot-single-workspace-connect-retry.yml' -Force
          git config user.name 'SIRK Automation'
          git config user.email 'sirk-automation@users.noreply.github.com'
          git add -A
          git commit -m 'feat(ui): use one explicit workspace connection'
          git push origin HEAD:main
