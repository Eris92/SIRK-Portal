name: Trigger existing .NET bundle workflow

on:
  push:
    paths:
      - .github/workflows/trigger-existing-dotnet-bundles.yml

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Trigger prepared migration
        run: |
          printf '\n# trigger: %s\n' "${GITHUB_SHA}" >> .github/workflows/temp-dotnet-bundles.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/temp-dotnet-bundles.yml
          git commit -m "ci: run .NET lazy bundle migration"
          git push origin HEAD:main

