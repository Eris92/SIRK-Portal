name: Temporary workspace inventory validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/validation/workspace-inventory-trigger.txt'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Apply workspace inventory routing fix
        run: python3 .github/validation/apply-workspace-inventory-fix.py
      - name: Validate workspace inventory contract
        shell: bash
        run: |
          set -euo pipefail
          file='public/portal/standalone/scripts/device-workspace.js'
          grep -F 'core.api("portal", "devices")' "$file"
          ! grep -F 'if (inventory) return Promise.resolve(inventory);' "$file"
          grep -F 'function nodeOnline(node) { return Number(node && node.conn || 0) > 0; }' "$file"
      - name: Validate Node-free .NET 10 Portal
        shell: bash
        run: bash .github/scripts/validate-node-free-dotnet10.sh
      - name: Commit product fix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/temporary-workspace-inventory-validation.yml
          rm -f .github/validation/apply-workspace-inventory-fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/portal/standalone/scripts/device-workspace.js .github/workflows/temporary-workspace-inventory-validation.yml .github/validation/apply-workspace-inventory-fix.py
          git commit -m 'fix: use tunneled Portal inventory in device workspace'
          git push origin HEAD:main
