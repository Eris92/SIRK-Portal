name: Apply persistent icon fix

on:
  push:
    branches:
      - fix/persistent-shell-icons-v302

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Apply persistent shell icon') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/persistent-shell-icons-v302
          fetch-depth: 0

      - name: Patch version and shell icon rendering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text.replace('3.0.0-dev.1', '3.0.0-dev.2')
              updated = updated.replace('<FileVersion>3.0.0.1</FileVersion>', '<FileVersion>3.0.0.2</FileVersion>')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          css_path = Path('public/portal/standalone/styles/module-shell.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Persistent shell icons: do not depend on inherited or dynamically injected colors. */'
          if marker not in css:
              block = r'''/* Persistent shell icons: do not depend on inherited or dynamically injected colors. */
#sirkPortalRoot .sirk-standalone-nav button[data-view="overview"],
#sirkPortalRoot .sirk-standalone-nav button[data-view="devices"] { --sirk-shell-icon-color: #55b8ff; }
#sirkPortalRoot .sirk-standalone-nav button[data-view="approvals"] { --sirk-shell-icon-color: #35d7a4; }
#sirkPortalRoot .sirk-standalone-nav button[data-view="automation"] { --sirk-shell-icon-color: #ffae00; }
#sirkPortalRoot .sirk-standalone-nav button[data-view="monitoring"] { --sirk-shell-icon-color: #34d1e7; }
#sirkPortalRoot .sirk-standalone-nav button[data-view="assets"] { --sirk-shell-icon-color: #9a7cff; }
#sirkPortalRoot .sirk-standalone-nav button[data-view="management"] { --sirk-shell-icon-color: #ff5f7d; }
#sirkPortalRoot .sirk-standalone-nav button[data-view="reports"] { --sirk-shell-icon-color: #7f85ff; }
#sirkPortalRoot .sirk-standalone-nav button[data-view="security"] { --sirk-shell-icon-color: #ff385d; }
#sirkPortalRoot .sirk-standalone-nav button[data-view="settings"] { --sirk-shell-icon-color: #94a3b8; }

#sirkPortalRoot .sirk-standalone-nav button[data-view] > span {
    color: var(--sirk-shell-icon-color, #55b8ff) !important;
    -webkit-text-fill-color: var(--sirk-shell-icon-color, #55b8ff) !important;
    filter: none !important;
    clip-path: none !important;
    mask: none !important;
    -webkit-mask: none !important;
}

#sirkPortalRoot .sirk-standalone-nav button[data-view] > span > svg,
#sirkPortalRoot .sirk-standalone-nav button[data-view] > span > svg :is(path,rect,circle,line,polyline,polygon,ellipse) {
    color: var(--sirk-shell-icon-color, #55b8ff) !important;
    stroke: var(--sirk-shell-icon-color, #55b8ff) !important;
    stroke-opacity: 1 !important;
    fill-opacity: 1 !important;
    filter: none !important;
    clip-path: none !important;
    mask: none !important;
    -webkit-mask: none !important;
}

#sirkPortalRoot .sirk-standalone-controls [data-action="sidebar"],
#sirkPortalRoot .sirk-standalone-controls [data-action="sidebar"] svg,
#sirkPortalRoot .sirk-standalone-controls [data-action="sidebar"] svg path {
    color: #edf4ff !important;
    stroke: #edf4ff !important;
    stroke-opacity: 1 !important;
    fill: none !important;
    opacity: 1 !important;
    visibility: visible !important;
    filter: none !important;
    clip-path: none !important;
    mask: none !important;
    -webkit-mask: none !important;
}

'''
              css_path.write_text(block + css, encoding='utf-8')

          Path('.github/workflows/apply-persistent-icon-fix.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply persistent shell icon and asset cache fix"
          git push origin HEAD:fix/persistent-shell-icons-v302
