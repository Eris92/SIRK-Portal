'''
          helpers = '''    private static IReadOnlyList<AgentInstallerTicketRecord> PruneInstallerTickets(
        IReadOnlyList<AgentInstallerTicketRecord>? source,
        DateTimeOffset now) =>
        (source ?? [])
        .Where(ticket =>
            ticket.ExpiresAtUtc > now ||
            (ticket.UsedAtUtc is { } used && used > now.AddDays(-7)))
        .TakeLast(2048)
        .ToArray();

    private static int FindInstallerTicket(
        IReadOnlyList<AgentInstallerTicketRecord> tickets,
        string groupId,
        string token,
        DateTimeOffset now)
    {
        var normalized = (token ?? string.Empty).Trim();
        var separator = normalized.IndexOf('.');
        if (separator <= 0) return -1;
        var id = normalized[..separator];
        return tickets
            .Select((ticket, index) => (ticket, index))
            .Where(value =>
                value.ticket.Id == id &&
                value.ticket.GroupId == groupId &&
                value.ticket.UsedAtUtc is null &&
                value.ticket.ExpiresAtUtc > now)
            .Where(value => VerifyToken(normalized, value.ticket.TokenHashBase64))
            .Select(value => value.index)
            .DefaultIfEmpty(-1)
            .First();
    }

