          method = '''    private static async Task<IResult> GenerateComputerGroupInstallerAsync(
        string groupId,
        ComputerGroupInstallerRequest request,
        HttpContext context,
        IAntiforgery antiforgery,
        AgentStore agents,
        PortalAuditLog audit,
        CancellationToken cancellationToken)
    {
        var csrf = await PortalAuthenticationEndpoints.ValidateCsrfAsync(context, antiforgery);
        if (csrf is not null) return csrf;

        var minutes = Math.Clamp(request.ValidMinutes ?? 24 * 60, 5, 7 * 24 * 60);
        var channel = (request.Channel ?? "stable").Trim().ToLowerInvariant();
        if (channel is not ("stable" or "dev"))
            return PortalAuthenticationEndpoints.Error(400, "AGENT_INSTALLER_CHANNEL_INVALID", "Channel must be stable or dev.");

        AgentInstallerTicketIssue issue;
        try
        {
            issue = agents.IssueInstallerTicket(groupId, TimeSpan.FromMinutes(minutes));
        }
        catch (KeyNotFoundException exception)
        {
            return PortalAuthenticationEndpoints.Error(404, "COMPUTER_GROUP_NOT_FOUND", exception.Message);
        }
        catch (InvalidOperationException exception)
        {
            return PortalAuthenticationEndpoints.Error(409, "COMPUTER_GROUP_DISABLED", exception.Message);
        }

        try
        {
            var origin = $"{context.Request.Scheme}://{context.Request.Host.Value}";
            var package = await AgentInstallerPackageBuilder.BuildAsync(
                origin,
                issue.Ticket.GroupId,
                issue.EnrollmentTicket,
                channel,
                cancellationToken);
            WriteGroupAudit(audit, context, "computer-group.generate-installer", issue.Ticket.GroupId);
            context.Response.Headers.CacheControl = "no-store, max-age=0";
            context.Response.Headers.Pragma = "no-cache";
            context.Response.Headers["X-SIRK-Installer-Expires-At"] = issue.Ticket.ExpiresAtUtc.ToString("O");
            context.Response.Headers["X-SIRK-Enrollment-Mode"] = "single-use";
            return Results.File(
                package.Content,
                "application/vnd.microsoft.portable-executable",
                package.FileName,
                enableRangeProcessing: false);
        }
        catch (Exception exception) when (
            exception is PlatformNotSupportedException or
            FileNotFoundException or
            InvalidDataException or
            InvalidOperationException or
            IOException)
        {
            agents.RevokeInstallerTicket(issue.Ticket.Id);
            return PortalAuthenticationEndpoints.Error(
                StatusCodes.Status503ServiceUnavailable,
                "AGENT_INSTALLER_GENERATION_FAILED",
                exception.Message);
        }
    }

