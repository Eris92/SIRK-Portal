'''
          new = '''    private void Save(AgentDocument value)
    {
        var normalized = value with
        {
            InstallerTickets = PruneInstallerTickets(
                value.InstallerTickets,
                DateTimeOffset.UtcNow)
        };
        _document = Validate(normalized);
        AtomicJsonFile.Write(_paths.AgentsFile, _document);
    }

    private static AgentDocument Validate(AgentDocument value)
    {
        if (value.SchemaVersion != SchemaVersion)
            throw new InvalidDataException("Agent store schema is unsupported.");
        var tickets = value.InstallerTickets ?? [];
        if (value.Groups.GroupBy(group => group.Id, StringComparer.Ordinal).Any(group => group.Count() > 1) ||
            value.Devices.GroupBy(device => device.Id, StringComparer.Ordinal).Any(group => group.Count() > 1) ||
            tickets.GroupBy(ticket => ticket.Id, StringComparer.Ordinal).Any(group => group.Count() > 1))
        {
            throw new InvalidDataException("Agent store contains duplicate identifiers.");
        }
        if (tickets.Any(ticket =>
                !value.Groups.Any(group => group.Id == ticket.GroupId) ||
                ticket.ExpiresAtUtc <= ticket.CreatedAtUtc))
        {
            throw new InvalidDataException("Agent installer ticket store is invalid.");
        }
        return value with { InstallerTickets = tickets };
    }
