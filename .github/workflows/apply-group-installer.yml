        return issueCsrf().then(function () {
            return fetch("/api/v1/admin/computer-groups/" + encodeURIComponent(group.id) + "/installer", {
                method: "POST",
                credentials: "same-origin",
                cache: "no-store",
                headers: {
                    Accept: "application/vnd.microsoft.portable-executable, application/json",
                    "Content-Type": "application/json; charset=UTF-8",
                    "X-SIRK-CSRF": state.csrf
                },
                body: JSON.stringify({ validMinutes: 1440, channel: "stable" })
            });
        }).then(function (response) {
            if (response.status === 401) {
                location.replace("/login");
                throw new Error("Authentication required.");
            }
            if (!response.ok) {
                return response.text().then(function (text) {
                    var payload = {};
                    try { payload = text ? JSON.parse(text) : {}; } catch (_) {}
                    throw new Error(payload.error || payload.title || ("HTTP " + response.status));
                });
            }
            var disposition = response.headers.get("Content-Disposition") || "";
            var match = /filename\*?=(?:UTF-8''|\")?([^\";]+)/i.exec(disposition);
            var fileName = match ? decodeURIComponent(match[1].replace(/^\"|\"$/g, "")) : ("SIRK-Agent-" + group.id + "-Installer.exe");
            var expires = response.headers.get("X-SIRK-Installer-Expires-At");
            return response.blob().then(function (blob) { return { blob: blob, fileName: fileName, expires: expires }; });
        }).then(function (download) {
            var url = URL.createObjectURL(download.blob);
            var link = el("a");
            link.href = url;
            link.download = download.fileName;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
            window.alert("Wygenerowano jednorazowy instalator EXE dla grupy " + group.name + "." +
                (download.expires ? " Ważny do: " + new Date(download.expires).toLocaleString() + "." : "") +
                " Po pierwszej poprawnej rejestracji nie może zostać użyty ponownie.");
        });
    }

