          test_block = '''var agentRoot = Path.Combine(Path.GetTempPath(), $"sirk-portal-agent-tickets-{Guid.NewGuid():N}");
try
{
    var configuration = new ConfigurationBuilder()
        .AddInMemoryCollection(new Dictionary<string, string?> { ["Sirk:DataRoot"] = agentRoot })
        .Build();
    var paths = new PortalPaths(configuration);
    var protector = DataProtectionProvider.Create(new DirectoryInfo(Path.Combine(agentRoot, "keys")));
    var agents = new AgentStore(paths, protector);
    var group = agents.CreateGroup("ticket-group", "Ticket Group", "Single-use installer contract");
    var installer = agents.IssueInstallerTicket("ticket-group", TimeSpan.FromHours(1));
    Assert(installer.EnrollmentTicket.StartsWith("install-", StringComparison.Ordinal),
        "Installer enrollment ticket prefix is invalid.");

    AgentEnrollmentRequest Enrollment(string deviceId, string token) => new(
        "ticket-group",
        token,
        deviceId,
        "tenant-test",
        deviceId,
        deviceId,
        "windows",
        "1.0.16",
        new Dictionary<string, string>());

    var first = agents.Enroll(Enrollment("device-ticket-1", installer.EnrollmentTicket), "127.0.0.1");
    Assert(first.Device.GroupId == "ticket-group", "Single-use installer ticket did not enroll in the bound group.");
    AssertThrows<UnauthorizedAccessException>(
        () => agents.Enroll(Enrollment("device-ticket-2", installer.EnrollmentTicket), "127.0.0.1"),
        "Single-use installer ticket was accepted more than once.");
    var legacy = agents.Enroll(Enrollment("device-group-token", group.EnrollmentToken), "127.0.0.1");
    Assert(legacy.Device.GroupId == "ticket-group", "Existing group-token enrollment contract regressed.");
    var snapshot = JsonSerializer.Serialize(agents.Snapshot());
    Assert(!snapshot.Contains(installer.EnrollmentTicket, StringComparison.Ordinal),
        "Installer ticket must not be exposed in the administrative snapshot.");
    Assert(new CentralTunnelOptions().Enabled,
        "Central tunnel must be ready by default and activate only after a protected Central connection is imported.");
}
finally
{
    if (Directory.Exists(agentRoot)) Directory.Delete(agentRoot, recursive: true);
}

Console.WriteLine("SIRK Portal signed heartbeat, protected config, filesystem scripts and single-use Agent installer contracts: OK");
