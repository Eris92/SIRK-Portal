    {
        var normalized = NormalizeId(groupId, "Group ID");
        var boundedLifetime = TimeSpan.FromMinutes(Math.Clamp(
            lifetime.TotalMinutes,
            5,
            7 * 24 * 60));
        lock (_sync)
        {
            var group = _document.Groups.FirstOrDefault(value => value.Id == normalized)
                        ?? throw new KeyNotFoundException("Agent group was not found.");
            if (!group.Enabled) throw new InvalidOperationException("Agent group is disabled.");

            var now = DateTimeOffset.UtcNow;
            var id = "install-" + Guid.NewGuid().ToString("N")[..20];
            var secret = Base64Url(RandomNumberGenerator.GetBytes(32));
            var token = id + "." + secret;
            var ticket = new AgentInstallerTicketRecord(
                id,
                normalized,
                HashToken(token),
                now,
                now.Add(boundedLifetime),
                null);
            Save(_document with
            {
                InstallerTickets = PruneInstallerTickets(
                        _document.InstallerTickets,
                        now)
                    .Append(ticket)
                    .ToArray(),
                UpdatedAtUtc = now
            });
            return new AgentInstallerTicketIssue(ticket, token);
        }
    }

    public void RevokeInstallerTicket(string ticketId)
    {
