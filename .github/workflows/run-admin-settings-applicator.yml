name: Run admin settings applicator

on:
  push:
    branches:
      - fix/admin-settings-central-updates-groups-icons

permissions:
  contents: write

concurrency:
  group: run-admin-settings-applicator
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Fix admin settings Central updates groups and icons') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-settings-central-updates-groups-icons
          fetch-depth: 0
      - name: Execute embedded verified transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-admin-settings-central-groups-icons.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n          git diff --check"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-admin-settings.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/apply-admin-settings.py
          rm -f .github/workflows/run-admin-settings-applicator.yml

          git diff --check
          find public -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          python3 -m py_compile .github/scripts/test-dotnet10-native-settings-v2.py
          grep -Fq 'MapGet("/central"' src/Sirk.Portal/Administration/PortalAdministrationEndpoints.cs
          grep -Fq 'MapGet("/computer-groups"' src/Sirk.Portal/Administration/PortalAdministrationEndpoints.cs
          grep -Fq '<symbol id="home"' public/assets/icons/sirk-ui.svg
          grep -Fq 'Aktualizuj teraz' public/portal/standalone/scripts/settings-native-v2.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix admin settings Central updates groups and icons'
          git push origin HEAD:fix/admin-settings-central-updates-groups-icons
