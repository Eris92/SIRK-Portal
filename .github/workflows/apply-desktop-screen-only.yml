name: Apply Desktop Screen-Only Layout

on:
  push:
    branches:
      - fix/desktop-screen-only
    paths:
      - .github/scripts/apply-desktop-screen-only.py
      - .github/workflows/apply-desktop-screen-only.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/desktop-screen-only
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply desktop layout
        run: python .github/scripts/apply-desktop-screen-only.py

      - name: Validate browser scripts
        run: |
          node --check public/portal/standalone/scripts/device-workspace.js
          node --check public/portal/standalone/scripts/device-tabs.js
          node --check public/portal/standalone/scripts/view-mode.js

      - name: Validate removed desktop UI
        shell: bash
        run: |
          ! grep -R -n -E 'sirk-agent-desktop-controls|sirk-agent-desktop-stats|sirk-agent-desktop-admin|sirk-agent-desktop-input|sirk-agent-desktop-clipboard|sirk-agent-policy-action|sirk-command-error' \
            public/portal/standalone/scripts/device-workspace.js \
            public/portal/standalone/styles/device-workspace.css \
            public/shared/ui/commands.css
          grep -n 'sirk-quick-commands-dock' public/portal/standalone/scripts/device-workspace.js
          grep -n 'setCompactCommandsConnected(host, true)' public/portal/standalone/scripts/device-workspace.js

      - name: Validate Portal contracts
        run: dotnet run --project tests/Sirk.Portal.ProtocolTests/Sirk.Portal.ProtocolTests.csproj --configuration Release

      - name: Remove migration helpers
        run: |
          rm .github/scripts/apply-desktop-screen-only.py
          rm .github/workflows/apply-desktop-screen-only.yml

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public tests .github
          git commit -m "fix(ui): show only the connected desktop screen"
          git push origin HEAD:fix/desktop-screen-only
