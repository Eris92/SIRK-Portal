name: Temporary Agent version validation

on:
  pull_request:
    paths:
      - '.github/triggers/agent-version-limit.txt'

permissions:
  contents: write

jobs:
  agent-version:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply Agent informational version fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          store_path = Path('src/Sirk.Portal/Agent/AgentStore.cs')
          store = store_path.read_text(encoding='utf-8')
          old = 'NormalizeText(request.AgentVersion, "Agent version", 64)'
          if store.count(old) != 2:
              raise SystemExit(f'Expected two Agent version limits, found {store.count(old)}')
          store = store.replace(old, 'NormalizeText(request.AgentVersion, "Agent version", 128)')
          store_path.write_text(store, encoding='utf-8')

          tests_path = Path('tests/Sirk.Portal.ProtocolTests/Program.cs')
          tests = tests_path.read_text(encoding='utf-8')
          marker = '    var ticketStoreText = File.ReadAllText(paths.AgentInstallerTicketsFile, Encoding.UTF8);'
          if marker not in tests:
              raise SystemExit('Protocol test insertion marker was not found.')
          regression = '''    var longAgentVersion = "1.0.16-dev.13+" + new string('a', 80);\n    var heartbeat = agents.Heartbeat(\n        first.Device.Id,\n        new AgentHeartbeatRequest(\n            "Device Installer One",\n            "device-installer-one",\n            "windows",\n            longAgentVersion,\n            "online",\n            new Dictionary<string, string>()),\n        "127.0.0.1");\n    Assert(heartbeat.AgentVersion == longAgentVersion,\n        "Agent check-in rejected a valid informational version longer than 64 characters.");\n\n'''
          tests = tests.replace(marker, regression + marker, 1)
          tests_path.write_text(tests, encoding='utf-8')
          PY

      - name: Validate Agent version contract
        shell: bash
        run: |
          test "$(grep -F -c 'NormalizeText(request.AgentVersion, "Agent version", 128)' src/Sirk.Portal/Agent/AgentStore.cs)" -eq 2
          ! grep -F 'NormalizeText(request.AgentVersion, "Agent version", 64)' src/Sirk.Portal/Agent/AgentStore.cs
          grep -F 'longAgentVersion' tests/Sirk.Portal.ProtocolTests/Program.cs

      - name: Build publish and test Node-free .NET 10 Portal
        shell: bash
        run: bash .github/scripts/validate-node-free-dotnet10.sh

      - name: Commit final Agent version fix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-agent-version-validation.yml
          git add src/Sirk.Portal/Agent/AgentStore.cs tests/Sirk.Portal.ProtocolTests/Program.cs
          git commit -m 'fix: accept full Agent informational versions'
          git push origin HEAD:main
