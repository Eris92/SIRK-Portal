name: Temporary PR-triggered .NET lazy bundles migration

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Apply .NET migrations
        run: |
          python3 tools/apply-dotnet-lazy-bundles.py
          python3 tools/apply-dotnet-desktop-probe.py
      - name: Verify product is Node-free
        shell: bash
        run: |
          forbidden="$(find . -type f \( -name package.json -o -name package-lock.json -o -name npm-shrinkwrap.json -o -name yarn.lock -o -name pnpm-lock.yaml -o -name .nvmrc \) -print -quit)"
          test -z "$forbidden"
          test -z "$(find . -type d -name node_modules -print -quit)"
          test ! -e tools/Test-DesktopWebSocket.js
          ! grep -RInE --include='*.js' --exclude-dir=.git 'require[[:space:]]*\(|module\.exports|process\.(argv|env|exitCode)' public tools
          while IFS= read -r file; do
            ! grep -InE '(^|[;&|[:space:]])(node|nodejs|npm|npx)([;&|[:space:]]|$)' "$file"
          done < <(find . -type f \( -name '*.sh' -o -name '*.ps1' -o -name '*.csproj' -o -name '*.props' -o -name '*.targets' -o -name 'Dockerfile*' \) ! -path './.git/*' | sort)
      - name: Build, publish and test .NET 10 Portal
        shell: bash
        run: |
          rm -rf /tmp/sirk-portal-publish
          dotnet build src/Sirk.Portal/Sirk.Portal.csproj -c Release --nologo
          dotnet build tools/Sirk.Portal.DesktopProbe/Sirk.Portal.DesktopProbe.csproj -c Release --nologo
          dotnet publish src/Sirk.Portal/Sirk.Portal.csproj -c Release --no-restore --nologo -o /tmp/sirk-portal-publish
          test -s /tmp/sirk-portal-publish/public/assets/bundles/portal-shell.bundle.js
          test -s /tmp/sirk-portal-publish/public/assets/bundles/portal-devices.bundle.js
          test -s /tmp/sirk-portal-publish/public/assets/bundles/portal-modules.bundle.js
          test -s /tmp/sirk-portal-publish/public/assets/bundles/portal-bundles.json
          grep -Fq 'portal-shell.bundle.js' /tmp/sirk-portal-publish/public/portal/standalone/index.html
          ! grep -Fq 'function loadDependencies()' /tmp/sirk-portal-publish/public/portal/standalone/scripts/app.js
          while IFS= read -r project; do
            dotnet test "$project" -c Release --nologo
          done < <(find tests -name '*.csproj' -type f | sort)
      - name: Commit final migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/temp-dotnet-bundles.yml .github/workflows/temp-dotnet-bundles-pr.yml .github/workflows/trigger-existing-dotnet-bundles.yml tools/apply-dotnet-lazy-bundles.py tools/apply-dotnet-desktop-probe.py || true
          git add -A
          git commit -m "perf: add .NET-built lazy Portal bundles"
          git push origin HEAD:main
