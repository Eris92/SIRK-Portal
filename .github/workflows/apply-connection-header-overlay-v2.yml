name: Apply Connection Header Overlay V2

on:
  push:
    branches: [fix/connection-header-overlay-fullscreen-exit]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/connection-header-overlay-fullscreen-exit
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Apply connection header overlay behavior
        run: python .github/scripts/apply-connection-header-overlay.py
      - name: Repair generated C# string assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/Sirk.Portal.ProtocolTests/DeviceConnectionWorkspaceContract.cs')
          lines = path.read_text(encoding='utf-8').splitlines()
          output = []
          replaced = 0
          for line in lines:
              if 'viewMode.Contains("var alreadyActive = document.documentElement.classList.contains(' in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  output.append(indent + 'viewMode.Contains("var alreadyActive = document.documentElement.classList.contains", StringComparison.Ordinal) &&')
                  output.append(indent + 'viewMode.Contains("&& !!document.fullscreenElement", StringComparison.Ordinal),')
                  replaced += 1
              else:
                  output.append(line)
          if replaced != 1:
              raise SystemExit(f'Expected one generated fullscreen assertion, found {replaced}.')
          path.write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY
      - name: Validate browser JavaScript
        run: node --check public/portal/standalone/scripts/view-mode.js
      - name: Validate Portal contracts
        run: dotnet run --project tests/Sirk.Portal.ProtocolTests/Sirk.Portal.ProtocolTests.csproj --configuration Release
      - name: Remove migration helpers
        run: |
          rm -f .github/scripts/apply-connection-header-overlay.py
          rm -f .github/workflows/apply-connection-header-overlay.yml
          rm -f .github/workflows/apply-connection-header-overlay-v2.yml
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/portal/standalone/scripts/view-mode.js tests/Sirk.Portal.ProtocolTests/DeviceConnectionWorkspaceContract.cs
          git add -u .github/scripts .github/workflows
          git commit -m "fix(ui): add connection header overlay and fullscreen exit"
          git push origin HEAD:fix/connection-header-overlay-fullscreen-exit
