name: Apply HTTP desktop input fallback

on:
  push:
    branches:
      - fix/http-desktop-input-fallback

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/http-desktop-input-fallback
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply bounded desktop input fallback
        run: python3 .github/scripts/apply-http-desktop-input-fallback.py

      - name: Build and run protocol tests
        shell: bash
        run: |
          dotnet restore src/Sirk.Portal/Sirk.Portal.csproj
          dotnet build src/Sirk.Portal/Sirk.Portal.csproj --configuration Release --no-restore
          dotnet run --project tests/Sirk.Portal.ProtocolTests/Sirk.Portal.ProtocolTests.csproj --configuration Release

      - name: Commit product change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve HTTP desktop input during Agent reconnect"
          git push origin HEAD:fix/http-desktop-input-fallback
