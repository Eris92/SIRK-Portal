name: SIRK Portal .NET 10 CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop, rewrite/dotnet10-node-free]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

concurrency:
  group: portal-dotnet10-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-product:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      applied: ${{ steps.apply.outputs.applied }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - id: apply
        name: Apply verified admin settings refactor
        shell: bash
        run: |
          set -euo pipefail
          helper='.github/workflows/apply-admin-settings-central-groups-icons.yml'
          if [[ ! -f "$helper" ]]; then
            echo 'applied=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-admin-settings-central-groups-icons.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n          git diff --check"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-admin-settings.py').write_text(script, encoding='utf-8')
          PY

          python3 /tmp/apply-admin-settings.py
          rm -f .github/workflows/run-admin-settings-applicator.yml
          git checkout origin/main -- .github/workflows/portal-dotnet10-ci.yml

          git diff --check
          find public -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          python3 -m py_compile .github/scripts/test-dotnet10-native-settings-v2.py
          grep -Fq 'MapGet("/central"' src/Sirk.Portal/Administration/PortalAdministrationEndpoints.cs
          grep -Fq 'MapGet("/computer-groups"' src/Sirk.Portal/Administration/PortalAdministrationEndpoints.cs
          grep -Fq '<symbol id="home"' public/assets/icons/sirk-ui.svg
          grep -Fq 'Aktualizuj teraz' public/portal/standalone/scripts/settings-native-v2.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix admin settings Central updates groups and icons'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
          echo 'applied=true' >> "$GITHUB_OUTPUT"

  linux-build-api-ui:
    needs: apply-product
    if: needs.apply-product.outputs.applied != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Build test publish API UI and container
        shell: bash
        run: bash .github/scripts/validate-node-free-dotnet10.sh

  windows-clean-install:
    needs: apply-product
    if: needs.apply-product.outputs.applied != 'true'
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Install and verify from zero
        shell: powershell
        run: .\.github\scripts\Test-NodeFreeWindowsInstall.ps1 -Branch '${{ github.head_ref || github.ref_name }}'
