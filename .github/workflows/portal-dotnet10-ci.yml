name: SIRK Portal .NET 10 CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop, rewrite/dotnet10-node-free]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

concurrency:
  group: portal-dotnet10-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build-api-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Build test publish API UI and container
        shell: bash
        run: bash .github/scripts/validate-node-free-dotnet10.sh

  windows-clean-install:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Validate protected Central tunnel installer contract
        shell: pwsh
        run: |
          $installer = Get-Content install-dotnet10.ps1 -Raw -Encoding UTF8
          if ($installer -notmatch 'CentralTunnel\s*=\s*@\{\s*Enabled\s*=\s*\$true') {
            throw 'Portal installer does not enable the protected Central reverse tunnel.'
          }
      - name: Validate Central-connected installer on Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\install-connected-dotnet10.ps1),
            [ref]$tokens,
            [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'install-connected-dotnet10.ps1 contains PowerShell syntax errors.'
          }

          $fixture = Join-Path $env:RUNNER_TEMP 'SIRK-Portal-ci-connection.json'
          [ordered]@{
            schemaVersion = 1
            centralUrl = 'https://central.example.test'
            tunnelUrl = 'wss://central.example.test/tunnel'
            portalId = 'ci-portal'
            portalName = 'CI Portal'
            portalToken = ('A' * 64)
            publicUrl = ''
            updatedAtUtc = [DateTimeOffset]::UtcNow.ToString('O')
          } | ConvertTo-Json | Set-Content -LiteralPath $fixture -Encoding UTF8

          .\install-connected-dotnet10.ps1 `
            -ConnectionFile $fixture `
            -PortalFqdn 'portal.example.test' `
            -ValidateOnly
          if ($LASTEXITCODE -ne 0) {
            throw "Connected installer validation failed with exit code $LASTEXITCODE."
          }
      - name: Validate single-use ticket and IExpress EXE contracts
        shell: pwsh
        run: dotnet run --project tests/Sirk.Portal.ProtocolTests/Sirk.Portal.ProtocolTests.csproj --configuration Release
      - name: Install and verify from zero
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .\.github\scripts\Test-NodeFreeWindowsInstall.ps1 -Branch '${{ github.head_ref || github.ref_name }}'

  binary-update-package:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Validate bootstrap syntax and binary update contract
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\install.ps1),
            [ref]$tokens,
            [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'install.ps1 contains PowerShell syntax errors.'
          }
          ./tests/binary-update-contract.ps1

      - name: Run Portal protocol contracts
        shell: pwsh
        run: dotnet run --project tests/Sirk.Portal.ProtocolTests/Sirk.Portal.ProtocolTests.csproj --configuration Release

      - name: Publish framework-dependent Portal
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publish = Join-Path $PWD 'artifacts/publish'
          dotnet publish src/Sirk.Portal/Sirk.Portal.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            --output $publish `
            /p:PublishSingleFile=false `
            /p:DebugType=None `
            /p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed: $LASTEXITCODE" }

          foreach ($required in @(
            'Sirk.Portal.exe',
            'Sirk.Portal.dll',
            'Sirk.Portal.runtimeconfig.json',
            'public/portal/standalone/index.html'
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $publish $required) -PathType Leaf)) {
              throw "Published Portal payload is incomplete: $required"
            }
          }
          if (Test-Path -LiteralPath (Join-Path $publish 'appsettings.Production.json')) {
            throw 'Machine-specific appsettings.Production.json must not be published.'
          }

      - name: Create package and SHA-256 metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publish = Join-Path $PWD 'artifacts/publish'
          $package = Join-Path $PWD 'artifacts/sirk-portal-win-x64.zip'
          $metadata = Join-Path $PWD 'artifacts/portal-update.json'

          [ordered]@{
            schemaVersion = 1
            applicationId = 'sirk-portal'
            channel = 'main'
            commit = '${{ github.sha }}'
            architecture = 'win-x64'
            deploymentMode = 'framework-dependent'
            targetFramework = 'net10.0'
            requiredRuntime = 'Microsoft.AspNetCore.App 10.0'
            createdAtUtc = [DateTimeOffset]::UtcNow.ToString('O')
          } | ConvertTo-Json -Depth 8 |
            Set-Content -LiteralPath (Join-Path $publish 'release-manifest.json') -Encoding UTF8

          Compress-Archive `
            -Path (Join-Path $publish '*') `
            -DestinationPath $package `
            -CompressionLevel Optimal `
            -Force

          $file = Get-Item -LiteralPath $package
          $sha256 = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash
          [ordered]@{
            schemaVersion = 1
            applicationId = 'sirk-portal'
            channel = 'main'
            commit = '${{ github.sha }}'
            package = 'sirk-portal-win-x64.zip'
            sha256 = $sha256
            sizeBytes = $file.Length
            architecture = 'win-x64'
            deploymentMode = 'framework-dependent'
            targetFramework = 'net10.0'
            requiredRuntime = 'Microsoft.AspNetCore.App 10.0'
            createdAtUtc = [DateTimeOffset]::UtcNow.ToString('O')
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $metadata -Encoding UTF8

      - name: Replace moving main release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          gh release view portal-main-latest *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete portal-main-latest --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to remove previous binary release. ExitCode=$LASTEXITCODE"
            }
          }
          elseif ($LASTEXITCODE -ne 1) {
            throw "Unable to query previous binary release. ExitCode=$LASTEXITCODE"
          }

          gh release create portal-main-latest `
            artifacts/sirk-portal-win-x64.zip `
            artifacts/portal-update.json `
            --target '${{ github.sha }}' `
            --title 'SIRK Portal main binary update' `
            --notes 'Automatically built, SHA-256 verified framework-dependent win-x64 update package.' `
            --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Unable to publish binary release. ExitCode=$LASTEXITCODE" }

      - uses: actions/upload-artifact@v4
        with:
          name: sirk-portal-win-x64-${{ github.sha }}
          path: |
            artifacts/sirk-portal-win-x64.zip
            artifacts/portal-update.json
          if-no-files-found: error
          retention-days: 14
