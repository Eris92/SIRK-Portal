name: SIRK Portal .NET 10 CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop, rewrite/dotnet10-node-free]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: portal-dotnet10-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Enforce Node-free repository contract
        shell: bash
        run: |
          set -euo pipefail
          forbidden_paths=(
            package.json package-lock.json server test scripts
            tools/watchdog tools/enrollment tools/install
            clean-install-managed.ps1 clean-install.ps1 install-v2.ps1 install-v3.ps1
          )
          for path in "${forbidden_paths[@]}"; do
            if [ -e "$path" ]; then
              echo "Forbidden Node/legacy path exists: $path" >&2
              exit 1
            fi
          done
          if grep -R --line-number -E 'node\.exe|npm(\.cmd)?|node-windows|package\.json|server/standalone|require\(' \
              src tests install.ps1 install-dotnet10.ps1 tools/installer Dockerfile; then
            echo 'Node.js runtime reference detected in server, installer or tests.' >&2
            exit 1
          fi

      - name: Validate PowerShell installers
        shell: pwsh
        run: |
          foreach ($path in @('install.ps1','install-dotnet10.ps1','tools/installer/Ensure-SirkUpdater.ps1')) {
            $source = Get-Content $path -Raw -Encoding UTF8
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseInput($source,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) {
              $errors | ForEach-Object { Write-Error "$path: $($_.Message)" }
              throw "PowerShell syntax validation failed: $path"
            }
          }

      - name: Restore
        run: dotnet restore tests/Sirk.Portal.ProtocolTests/Sirk.Portal.ProtocolTests.csproj

      - name: Build
        run: dotnet build tests/Sirk.Portal.ProtocolTests/Sirk.Portal.ProtocolTests.csproj --configuration Release --no-restore

      - name: Protocol and security contracts
        run: dotnet run --project tests/Sirk.Portal.ProtocolTests/Sirk.Portal.ProtocolTests.csproj --configuration Release --no-build

      - name: Publish self-contained runtimes
        shell: bash
        run: |
          dotnet publish src/Sirk.Portal/Sirk.Portal.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/win-x64 /p:DebugType=None /p:DebugSymbols=false
          dotnet publish src/Sirk.Portal/Sirk.Portal.csproj --configuration Release --runtime linux-x64 --self-contained true --output artifacts/linux-x64 /p:DebugType=None /p:DebugSymbols=false

      - name: Verify complete published frontend
        shell: python
        run: |
          from pathlib import Path
          required = (
              'public/portal/standalone/index.html',
              'public/portal/standalone/login.html',
              'public/portal/standalone/scripts/core.js',
              'public/portal/standalone/scripts/app.js',
              'public/portal/standalone/scripts/settings-native-v2.js',
              'public/portal/standalone/styles/base.css',
              'public/portal/settings.js',
              'public/portal/subfolder-icons.js',
              'public/shared/ui/shared-ui.css',
              'public/assets/icons/sirk-ui.svg',
          )
          roots = (Path('artifacts/win-x64'), Path('artifacts/linux-x64'))
          missing = [str(root / item) for root in roots for item in required if not (root / item).is_file()]
          if missing:
              raise SystemExit('Published frontend is incomplete: ' + ', '.join(missing))

      - name: Native API and full UI smoke
        shell: bash
        run: |
          python3 .github/scripts/test-dotnet10-central-heartbeat.py artifacts/linux-x64/Sirk.Portal
          python3 .github/scripts/test-dotnet10-native-api.py artifacts/linux-x64/Sirk.Portal
          python3 .github/scripts/test-dotnet10-native-settings-v2.py artifacts/linux-x64/Sirk.Portal
          python3 .github/scripts/test-dotnet10-full-ui.py artifacts/linux-x64/Sirk.Portal

      - name: Container build and health smoke
        shell: bash
        run: |
          docker build --tag sirk-portal:dotnet10 .
          docker run --detach --name sirk-portal-smoke --health-interval 1s --health-timeout 5s --health-start-period 1s --health-retries 30 sirk-portal:dotnet10
          trap 'docker logs sirk-portal-smoke || true; docker rm --force --volumes sirk-portal-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' sirk-portal-smoke)
            [ "$status" = healthy ] && exit 0
            [ "$status" = unhealthy ] && exit 1
            sleep 1
          done
          exit 1

  windows-clean-install:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      SIRK_SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
      SIRK_TEST_FQDN: portal-ci.sirk.local
      SIRK_TEST_PORT: 9443
      SIRK_TEST_PASSWORD: Sirk-Portal-Windows-Installer-2026!
      NO_PROXY: portal-ci.sirk.local,localhost,127.0.0.1
      no_proxy: portal-ci.sirk.local,localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4

      - name: Install from zero
        shell: powershell
        run: |
          $env:SIRK_INSTALL_FQDN = $env:SIRK_TEST_FQDN
          $env:SIRK_INSTALL_BREAKGLASS_PASSWORD = $env:SIRK_TEST_PASSWORD
          $env:SIRK_INSTALL_TRUST_CERTIFICATE = 'true'
          $source = Get-Content '.\install.ps1' -Raw -Encoding UTF8
          $installer = [scriptblock]::Create($source)
          & $installer `
            -Branch $env:SIRK_SOURCE_BRANCH `
            -NonInteractive `
            -RemoveData `
            -PortalFqdn $env:SIRK_TEST_FQDN `
            -HttpsPort ([int]$env:SIRK_TEST_PORT) `
            -TrustCertificate

      - name: Verify service TLS UI login restart and updater
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('SirkPortal','SirkUpdater')) {
            $service = Get-Service $name
            if ($service.Status -ne 'Running' -or $service.StartType -ne 'Automatic') {
              throw "Invalid service state for $name: $($service.Status) / $($service.StartType)"
            }
          }
          $wmi = Get-CimInstance Win32_Service -Filter "Name='SirkPortal'"
          if ($wmi.PathName -notmatch 'Sirk\.Portal\.exe') { throw "Invalid service command: $($wmi.PathName)" }

          $certificate = Get-ChildItem Cert:\LocalMachine\My |
            Where-Object FriendlyName -eq 'SIRK Portal HTTPS' |
            Sort-Object NotBefore -Descending |
            Select-Object -First 1
          if (-not $certificate -or -not $certificate.HasPrivateKey) { throw 'Portal certificate is missing.' }
          if (-not (Get-ChildItem Cert:\LocalMachine\Root | Where-Object Thumbprint -eq $certificate.Thumbprint)) {
            throw 'Portal certificate is not trusted.'
          }

          $baseUrl = "https://$($env:SIRK_TEST_FQDN):$($env:SIRK_TEST_PORT)"
          if ((Invoke-RestMethod "$baseUrl/healthz").status -ne 'healthy') { throw 'Health failed.' }
          if ((Invoke-RestMethod "$baseUrl/readyz").status -ne 'ready') { throw 'Readiness failed.' }
          foreach ($asset in @('/login','/assets/portal-login.css','/assets/portal-standalone.css','/assets/standalone-core.js','/assets/portal-standalone.js','/assets/settings.js','/assets/icons/sirk-ui.svg')) {
            $response = Invoke-WebRequest ($baseUrl + $asset) -UseBasicParsing
            if ($response.StatusCode -ne 200 -or $response.RawContentLength -lt 10) { throw "Frontend asset failed: $asset" }
          }

          $accessCode = (Get-Content 'C:\ProgramData\SIRK\Portal\security\break-glass-access-code.txt' -Raw).Trim()
          $session = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          $payload = @{ userName='admin'; password=$env:SIRK_TEST_PASSWORD; accessCode=$accessCode } | ConvertTo-Json -Compress
          $login = Invoke-RestMethod "$baseUrl/api/v1/auth/login" -Method Post -ContentType 'application/json' -Body $payload -WebSession $session
          if ($login.user.role -ne 'Break-Glass') { throw 'Break-Glass login failed.' }
          $portal = (Invoke-WebRequest "$baseUrl/" -WebSession $session -UseBasicParsing).Content
          foreach ($marker in @('sirkStandaloneRoot','data-view="devices"','data-view="settings"')) {
            if ($portal -notmatch [regex]::Escape($marker)) { throw "Portal UI marker missing: $marker" }
          }

          Restart-Service SirkPortal -Force
          (Get-Service SirkPortal).WaitForStatus('Running',[TimeSpan]::FromSeconds(60))
          $deadline = (Get-Date).AddMinutes(2)
          do {
            try { if ((Invoke-RestMethod "$baseUrl/readyz" -TimeoutSec 5).status -eq 'ready') { break } } catch {}
            Start-Sleep -Seconds 2
          } while ((Get-Date) -lt $deadline)
          if ((Invoke-RestMethod "$baseUrl/readyz").status -ne 'ready') { throw 'Portal restart recovery failed.' }

      - name: Diagnostics
        if: failure()
        shell: powershell
        run: |
          Get-Service SirkPortal,SirkUpdater -ErrorAction SilentlyContinue | Format-List *
          Get-Content 'C:\ProgramData\SIRK\Logs\Portal-DotNet10-Install.log' -Tail 300 -ErrorAction SilentlyContinue
          Get-WinEvent -FilterHashtable @{LogName='Application';StartTime=(Get-Date).AddMinutes(-25)} -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'Sirk\.Portal|SirkUpdater' } | Select-Object -First 50 | Format-List

      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          foreach ($name in @('SirkPortal','SirkUpdater')) {
            $service = Get-Service $name -ErrorAction SilentlyContinue
            if ($service) {
              Stop-Service $name -Force -ErrorAction SilentlyContinue
              & sc.exe delete $name | Out-Null
              $global:LASTEXITCODE = 0
            }
          }
          Remove-NetFirewallRule -DisplayName 'SIRK Portal HTTPS' -ErrorAction SilentlyContinue
          Get-ChildItem Cert:\LocalMachine\My,Cert:\LocalMachine\Root -ErrorAction SilentlyContinue |
            Where-Object FriendlyName -eq 'SIRK Portal HTTPS' | Remove-Item -Force -ErrorAction SilentlyContinue
          Remove-Item 'C:\Program Files\SIRK\Portal','C:\ProgramData\SIRK\Portal' -Recurse -Force -ErrorAction SilentlyContinue
