name: Apply canonical Agent v1 tests

on:
  push:
    branches:
      - feat/canonical-agent-management-v1

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/canonical-agent-management-v1
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Apply canonical Agent test migration
        run: python3 .github/scripts/apply_canonical_agent_v1_tests.py
      - name: Build and run Portal protocol and Agent ECDSA smoke tests
        shell: bash
        run: |
          dotnet restore tests/Sirk.Portal.ProtocolTests/Sirk.Portal.ProtocolTests.csproj
          dotnet build tests/Sirk.Portal.ProtocolTests/Sirk.Portal.ProtocolTests.csproj -c Release --no-restore
          dotnet run --project tests/Sirk.Portal.ProtocolTests/Sirk.Portal.ProtocolTests.csproj -c Release --no-build
          dotnet publish src/Sirk.Portal/Sirk.Portal.csproj -c Release -r linux-x64 --self-contained false -o artifacts/linux-x64
          python3 .github/scripts/test-dotnet10-native-api.py artifacts/linux-x64/Sirk.Portal.dll
          python3 .github/scripts/test-dotnet10-agent-v1.py artifacts/linux-x64/Sirk.Portal.dll
      - name: Validate removal of old Agent test transport
        shell: bash
        run: |
          if grep -R '/api/agent/v1/' .github/scripts --include='*.py' --include='*.sh'; then
            echo 'Legacy Agent management route remains in Portal tests.' >&2
            exit 1
          fi
          test ! -e .github/scripts/test-dotnet10-agent-v1-compat.py
          grep -F 'test-dotnet10-agent-v1.py' .github/scripts/validate-node-free-dotnet10.sh
      - name: Commit test migration
        shell: bash
        run: |
          rm -f .github/scripts/apply_canonical_agent_v1_tests.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts
          git commit -m 'test: use canonical ECDSA Agent management v1'
          git push origin HEAD:feat/canonical-agent-management-v1
