name: Apply Command Workspace Migration

on:
  push:
    branches:
      - fix/unify-command-workspace

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply canonical Commands workspace
        run: python .github/scripts/apply-command-workspace.py
      - name: Validate generated browser JavaScript
        run: node --check public/portal/standalone/scripts/device-workspace.js
      - name: Remove migration helpers
        run: |
          rm -f .github/scripts/apply-command-workspace.py
          rm -f .github/workflows/apply-command-workspace.yml
      - name: Commit product changes
        run: |
          git config user.name "Eris92"
          git config user.email "43513086+Eris92@users.noreply.github.com"
          git add -A
          git commit -m "fix(ui): unify Commands and Quick Commands workspace"
          git push origin HEAD:fix/unify-command-workspace
