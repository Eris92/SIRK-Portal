name: Apply Isolated SDK Cache

on:
  push:
    branches:
      - fix/reuse-isolated-dotnet-sdk
    paths:
      - .github/scripts/apply-build-sdk-cache.py
      - .github/scripts/fix-build-sdk-cache-migration.py
      - .github/workflows/apply-build-sdk-cache.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reuse-isolated-dotnet-sdk
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Normalize and apply migration
        shell: pwsh
        run: |
          python .github/scripts/fix-build-sdk-cache-migration.py
          if ($LASTEXITCODE -ne 0) { throw 'Migration normalization failed.' }
          python .github/scripts/apply-build-sdk-cache.py
          if ($LASTEXITCODE -ne 0) { throw 'SDK cache migration failed.' }
      - name: Validate PowerShell 5.1 syntax
        shell: powershell
        run: |
          foreach ($path in @(
            '.\install.ps1',
            '.\install-dotnet10.ps1',
            '.\install-connected-dotnet10.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("{0}: {1}" -f $path, $_.Message) }
              throw "$path contains PowerShell syntax errors."
            }
          }
      - name: Validate cache contract
        shell: pwsh
        run: dotnet run --project tests/Sirk.Portal.ProtocolTests/Sirk.Portal.ProtocolTests.csproj --configuration Release
      - name: Validate exact-version reuse markers
        shell: pwsh
        run: |
          $source = Get-Content .\install-dotnet10.ps1 -Raw -Encoding UTF8
          foreach ($marker in @(
            '[switch]$KeepBuildSdk',
            'Test-IsolatedDotNetSdk',
            "SIRK\Build Cache\dotnet-sdk",
            'Pomijam pobieranie',
            'Join-Path $persistentBuildSdkRoot $sdkVersion'
          )) {
            if (-not $source.Contains($marker)) { throw "Missing SDK cache marker: $marker" }
          }
      - name: Remove migration helpers
        shell: bash
        run: |
          rm -f .github/scripts/apply-build-sdk-cache.py
          rm -f .github/scripts/fix-build-sdk-cache-migration.py
          rm -f .github/workflows/apply-build-sdk-cache.yml
      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install.ps1 \
                  install-dotnet10.ps1 \
                  install-connected-dotnet10.ps1 \
                  tests/Sirk.Portal.ProtocolTests/Program.cs \
                  tests/Sirk.Portal.ProtocolTests/InstallerBuildSdkCacheContract.cs \
                  .github/scripts/apply-build-sdk-cache.py \
                  .github/scripts/fix-build-sdk-cache-migration.py \
                  .github/workflows/apply-build-sdk-cache.yml
          git commit -m "fix(installer): reuse isolated .NET SDK in test mode"
          git push origin HEAD:fix/reuse-isolated-dotnet-sdk
