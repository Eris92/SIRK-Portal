name: One-shot single workspace connection

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-single-workspace-connect.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ contains(github.event.head_commit.message, '[run-single-workspace-connect]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Apply single workspace connection model
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/sirk_patch.py
          python3 /tmp/sirk_patch.py
      - name: Validate Portal contracts
        shell: bash
        run: dotnet run --project tests/Sirk.Portal.ProtocolTests/Sirk.Portal.ProtocolTests.csproj --configuration Release
      - name: Commit validated connection model
        shell: bash
        run: |
          git config user.name 'SIRK Automation'
          git config user.email 'sirk-automation@users.noreply.github.com'
          git add public/portal/standalone/scripts/device-tabs.js public/portal/standalone/styles/device-tabs.css public/portal/standalone/scripts/device-workspace.js public/portal/standalone/styles/device-workspace.css tests/Sirk.Portal.ProtocolTests/DeviceHostTabSplitContract.cs .github/workflows/one-shot-single-workspace-connect.yml
          git commit -m 'feat(ui): use one explicit workspace connection'
          git push origin HEAD:main
