name: One-shot polished host tab controls

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-stack-overlay-handles.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ contains(github.event.head_commit.message, '[run-tab-actions]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Apply polished host-tab controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          tabs_path = Path('public/portal/standalone/scripts/device-tabs.js')
          css_path = Path('public/portal/standalone/styles/device-tabs.css')
          workspace_path = Path('public/portal/standalone/scripts/device-workspace.js')
          test_path = Path('tests/Sirk.Portal.ProtocolTests/DeviceHostTabSplitContract.cs')
          workflow_path = Path('.github/workflows/one-shot-stack-overlay-handles.yml')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one occurrence, found {count}')
              return text.replace(old, new, 1)

          tabs = tabs_path.read_text(encoding='utf-8')
          tabs = replace_once(
              tabs,
              'if (window.__sirkPlatformDeviceTabsV14Loaded) return;\n    window.__sirkPlatformDeviceTabsV14Loaded = true;',
              'if (window.__sirkPlatformDeviceTabsV15Loaded) return;\n    window.__sirkPlatformDeviceTabsV15Loaded = true;',
              'device tabs version marker')
          tabs = replace_once(
              tabs,
              '        pendingSection: Object.create(null),\n',
              '        pendingSection: Object.create(null),\n        pendingDesktopAction: Object.create(null),\n',
              'pending desktop state')
          tabs = replace_once(
              tabs,
              '    function clean(value) { return String(value || "").replace(/\\s+/g, " ").trim(); }\n',
              '    var TAB_ICONS = {\n'
              '        close: \'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>\',\n'
              '        menu: \'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>\',\n'
              '        connect: \'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 14.5l5-5"/><path d="M7.2 16.8l-1.4 1.4a3 3 0 104.2 4.2l3.2-3.2a3 3 0 000-4.2"/><path d="M16.8 7.2l1.4-1.4A3 3 0 102 1.6L.8 4.8a3 3 0 000 4.2" transform="translate(4 0)"/></svg>\',\n'
              '        disconnect: \'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 16l-2 2a3 3 0 104 4l3-3"/><path d="M16 8l2-2a3 3 0 10-4-4l-3 3"/><path d="M5 5l14 14"/></svg>\'\n'
              '    };\n\n'
              '    function clean(value) { return String(value || "").replace(/\\s+/g, " ").trim(); }\n',
              'tab icon definitions')
          tabs = replace_once(
              tabs,
              '            pane = { key: key, nodeId: nodeId || "", name: name || nodeId || key, online: online === true };',
              '            pane = { key: key, nodeId: nodeId || "", name: name || nodeId || key, online: online === true, connected: false };',
              'pane connected state')
          tabs = replace_once(
              tabs,
              '        if (!wideMode() || !state.panes[key]) return;',
              '        if (!state.panes[key]) return;',
              'host menu availability')
          tabs = replace_once(
              tabs,
              '            return key === "all" ? "all:" + allLabel() : key + ":" + state.panes[key].name + ":" + (state.panes[key].online ? "1" : "0");',
              '            return key === "all" ? "all:" + allLabel() : key + ":" + state.panes[key].name + ":" + (state.panes[key].online ? "1" : "0") + ":" + (state.panes[key].connected ? "1" : "0");',
              'tab render signature')
          tabs = replace_once(
              tabs,
              '                (state.active === key ? " is-active" : "") + (pane.online ? " is-online" : " is-offline");',
              '                (state.active === key ? " is-active" : "") + (pane.online ? " is-online" : " is-offline") + (pane.connected ? " is-desktop-connected" : "");',
              'desktop connected class')
          tabs = replace_once(
              tabs,
              '            main.appendChild(label);\n\n            var actions = document.createElement("span");',
              '            main.appendChild(label);\n\n'
              '            var connectionActions = document.createElement("span");\n'
              '            connectionActions.className = "sirk-device-tab-connection-actions";\n\n'
              '            var connect = document.createElement("button");\n'
              '            connect.type = "button";\n'
              '            connect.className = "sirk-device-tab-connect";\n'
              '            connect.innerHTML = TAB_ICONS.connect + "<span>" + (language() === "en" ? "Connect" : "Połącz") + "</span>";\n'
              '            connect.setAttribute("data-device-tab-connect", key);\n'
              '            connect.setAttribute("aria-label", (language() === "en" ? "Connect to " : "Połącz z ") + pane.name);\n'
              '            connect.disabled = !pane.online || pane.connected === true;\n\n'
              '            var disconnect = document.createElement("button");\n'
              '            disconnect.type = "button";\n'
              '            disconnect.className = "sirk-device-tab-disconnect";\n'
              '            disconnect.innerHTML = TAB_ICONS.disconnect + "<span>" + (language() === "en" ? "Disconnect" : "Rozłącz") + "</span>";\n'
              '            disconnect.setAttribute("data-device-tab-disconnect", key);\n'
              '            disconnect.setAttribute("aria-label", (language() === "en" ? "Disconnect from " : "Rozłącz z ") + pane.name);\n'
              '            disconnect.disabled = pane.connected !== true;\n\n'
              '            connectionActions.appendChild(connect);\n'
              '            connectionActions.appendChild(disconnect);\n\n'
              '            var actions = document.createElement("span");',
              'connection action controls')
          tabs = replace_once(
              tabs,
              '            close.textContent = "×";',
              '            close.innerHTML = TAB_ICONS.close;',
              'close icon')
          tabs = replace_once(
              tabs,
              '            menuToggle.innerHTML = \'<span aria-hidden="true">⌄</span>\';',
              '            menuToggle.innerHTML = TAB_ICONS.menu;',
              'menu icon')
          tabs = replace_once(
              tabs,
              '            menuToggle.disabled = !wideMode();',
              '            menuToggle.disabled = false;',
              'menu enabled state')
          tabs = replace_once(
              tabs,
              '            shell.appendChild(main);\n            shell.appendChild(actions);',
              '            shell.appendChild(main);\n            shell.appendChild(connectionActions);\n            shell.appendChild(actions);',
              'host tab structure')

          activate_anchor = '''    function closeTab(key) {\n'''
          desktop_action = '''    function requestDesktopAction(key, shouldConnect) {\n        var pane = state.panes[key];\n        if (!pane || (shouldConnect && !pane.online)) return;\n        hideMenu();\n        state.pendingDesktopAction[key] = shouldConnect ? "connect" : "disconnect";\n        activatePane(key, "desktop");\n\n        var attempts = 0;\n        function invoke() {\n            attempts += 1;\n            if (!state.pendingDesktopAction[key] || !state.panes[key]) return;\n            var currentId = clean(state.content && state.content.getAttribute("data-sirk-active-device-id"));\n            var selector = shouldConnect ? "[data-agent-desktop-connect]" : "[data-agent-desktop-disconnect]";\n            var button = state.content && state.content.querySelector(selector);\n            if (contentIsWorkspace() && currentId === pane.nodeId && button) {\n                delete state.pendingDesktopAction[key];\n                if (!button.disabled) {\n                    try { button.click(); } catch (error) {}\n                }\n                return;\n            }\n            if (attempts < 180) window.setTimeout(invoke, 50);\n            else delete state.pendingDesktopAction[key];\n        }\n        window.setTimeout(invoke, 0);\n    }\n\n'''
          tabs = replace_once(tabs, activate_anchor, desktop_action + activate_anchor, 'desktop action function')

          intercept_anchor = '''        var close = event.target && event.target.closest && event.target.closest("[data-device-tab-close]");\n'''
          intercept_actions = '''        var connectAction = event.target && event.target.closest && event.target.closest("[data-device-tab-connect]");\n        if (connectAction && state.bar.contains(connectAction)) {\n            event.preventDefault();\n            event.stopPropagation();\n            if (typeof event.stopImmediatePropagation === "function") event.stopImmediatePropagation();\n            requestDesktopAction(connectAction.getAttribute("data-device-tab-connect"), true);\n            return;\n        }\n\n        var disconnectAction = event.target && event.target.closest && event.target.closest("[data-device-tab-disconnect]");\n        if (disconnectAction && state.bar.contains(disconnectAction)) {\n            event.preventDefault();\n            event.stopPropagation();\n            if (typeof event.stopImmediatePropagation === "function") event.stopImmediatePropagation();\n            requestDesktopAction(disconnectAction.getAttribute("data-device-tab-disconnect"), false);\n            return;\n        }\n\n'''
          tabs = replace_once(tabs, intercept_anchor, intercept_actions + intercept_anchor, 'connection click interception')

          bind_anchor = '''        window.addEventListener("sirkportal:languagechange", function () {\n'''
          state_listener = '''        window.addEventListener("sirkportal:desktopconnectionstate", function (event) {\n            var detail = event && event.detail || {};\n            var nodeId = clean(detail.nodeId);\n            if (!nodeId) return;\n            Object.keys(state.panes).some(function (key) {\n                var pane = state.panes[key];\n                if (clean(pane.nodeId) !== nodeId) return false;\n                pane.connected = detail.connected === true;\n                renderTabs();\n                return true;\n            });\n        });\n'''
          tabs = replace_once(tabs, bind_anchor, state_listener + bind_anchor, 'desktop connection state listener')
          tabs_path.write_text(tabs, encoding='utf-8', newline='')

          css = css_path.read_text(encoding='utf-8')
          css = replace_once(
              css,
              '#sirkPortalRoot .sirk-device-tab{flex:0 0 auto;max-width:230px;height:38px;min-height:38px;',
              '#sirkPortalRoot .sirk-device-tab{flex:0 0 auto;max-width:300px;height:42px;min-height:42px;',
              'host tab dimensions')
          css = replace_once(
              css,
              '#sirkPortalRoot .sirk-device-host-tab{display:grid;grid-template-columns:minmax(72px,1fr) 25px;grid-template-rows:1fr 1fr;min-width:118px;padding:0;overflow:visible}',
              '#sirkPortalRoot .sirk-device-host-tab{display:grid;grid-template-columns:minmax(148px,1fr) 30px;grid-template-rows:21px 21px;min-width:206px;padding:0;overflow:hidden}',
              'host tab grid')
          css = replace_once(
              css,
              '#sirkPortalRoot .sirk-device-tab-main{grid-column:1;grid-row:1 / span 2;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0!important;height:auto;padding:0 10px;border:0;border-radius:8px 0 0 8px;background:transparent;color:inherit;font:inherit;cursor:pointer;box-sizing:border-box}',
              '#sirkPortalRoot .sirk-device-tab-main{grid-column:1;grid-row:1;display:flex;align-items:center;justify-content:flex-start;min-width:0;min-height:0!important;height:auto;padding:0 10px;border:0;border-radius:8px 0 0 0;background:transparent;color:inherit;font:inherit;cursor:pointer;box-sizing:border-box}',
              'host tab title layout')
          css = replace_once(
              css,
              '#sirkPortalRoot .sirk-device-tab-actions{grid-column:2;grid-row:1 / span 2;align-self:stretch;display:grid;grid-template-rows:minmax(0,1fr);min-height:0;height:auto;border-left:1px solid rgba(101,113,135,.28)}',
              '#sirkPortalRoot .sirk-device-tab-actions{grid-column:2;grid-row:1 / span 2;align-self:stretch;display:grid;grid-template-rows:1fr 1fr;min-height:0;height:auto;border-left:1px solid rgba(101,113,135,.28)}',
              'host side actions')
          css = replace_once(
              css,
              '#sirkPortalRoot .sirk-device-tab-close,#sirkPortalRoot .sirk-device-tab-menu-toggle{display:grid;place-items:center;width:24px;min-width:24px;min-height:0!important;height:auto;padding:0;border:0;background:transparent;color:inherit;font:600 14px/1 Segoe UI,Arial,sans-serif;cursor:pointer;opacity:.78;box-sizing:border-box}\n#sirkPortalRoot .sirk-device-tab-menu-toggle{display:none;font-size:12px}',
              '#sirkPortalRoot .sirk-device-tab-close,#sirkPortalRoot .sirk-device-tab-menu-toggle{display:grid;place-items:center;width:29px;min-width:29px;min-height:0!important;height:auto;padding:0;border:0;background:transparent;color:inherit;cursor:pointer;opacity:.9;box-sizing:border-box}\n#sirkPortalRoot .sirk-device-tab-close svg,#sirkPortalRoot .sirk-device-tab-menu-toggle svg{display:block;width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}\n#sirkPortalRoot .sirk-device-tab-menu-toggle{display:grid}',
              'crisp close and menu icons')
          css = replace_once(
              css,
              'html.sirk-device-focus-mode #sirkPortalRoot .sirk-device-tab-actions,\nhtml.sirk-device-connection-mode #sirkPortalRoot .sirk-device-tab-actions{grid-template-rows:1fr 1fr}\n',
              '',
              'obsolete expanded action grid')
          css = replace_once(
              css,
              'html.sirk-device-focus-mode #sirkPortalRoot .sirk-device-tab-menu-toggle,\nhtml.sirk-device-connection-mode #sirkPortalRoot .sirk-device-tab-menu-toggle{display:grid}\n',
              '',
              'obsolete expanded menu visibility')
          css = replace_once(
              css,
              '#sirkPortalRoot .sirk-device-tab-label{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n',
              '#sirkPortalRoot .sirk-device-tab-label{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n'
              '#sirkPortalRoot .sirk-device-tab-connection-actions{grid-column:1;grid-row:2;display:grid;grid-template-columns:1fr 1fr;min-width:0;border-top:1px solid rgba(101,113,135,.24)}\n'
              '#sirkPortalRoot .sirk-device-tab-connect,#sirkPortalRoot .sirk-device-tab-disconnect{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:0;min-height:0!important;height:20px;padding:0 7px;border:0;background:transparent;font:700 10px/1 Segoe UI,Arial,sans-serif;cursor:pointer;transition:background .14s ease,color .14s ease,opacity .14s ease}\n'
              '#sirkPortalRoot .sirk-device-tab-connect{border-radius:0 0 0 8px;color:#16a34a}\n'
              '#sirkPortalRoot .sirk-device-tab-disconnect{border-left:1px solid rgba(101,113,135,.24);color:#dc2626}\n'
              '#sirkPortalRoot .sirk-device-tab-connect svg,#sirkPortalRoot .sirk-device-tab-disconnect svg{display:block;flex:0 0 12px;width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}\n'
              '#sirkPortalRoot .sirk-device-tab-connect:hover:not(:disabled),#sirkPortalRoot .sirk-device-tab-connect:focus-visible{background:rgba(34,197,94,.16);color:#15803d;outline:none}\n'
              '#sirkPortalRoot .sirk-device-tab-disconnect:hover:not(:disabled),#sirkPortalRoot .sirk-device-tab-disconnect:focus-visible{background:rgba(220,38,38,.14);color:#b91c1c;outline:none}\n'
              '#sirkPortalRoot .sirk-device-tab-connect:disabled,#sirkPortalRoot .sirk-device-tab-disconnect:disabled{opacity:.28;cursor:default}\n'
              '#sirkPortalRoot .sirk-device-host-tab.is-desktop-connected .sirk-device-tab-connect{background:rgba(34,197,94,.12);color:#15803d}\n'
              '#sirkPortalRoot .sirk-device-host-tab.is-desktop-connected .sirk-device-tab-disconnect{opacity:1}\n',
              'connection action styles')
          css = replace_once(
              css,
              'html.sirk-device-focus-mode #sirkPortalRoot .sirk-device-tab-close,\nhtml.sirk-device-connection-mode #sirkPortalRoot .sirk-device-tab-close{border-bottom:1px solid rgba(101,113,135,.28)}',
              '#sirkPortalRoot .sirk-device-tab-close{border-bottom:1px solid rgba(101,113,135,.28)}',
              'close/menu divider')
          css_path.write_text(css, encoding='utf-8', newline='')

          workspace = workspace_path.read_text(encoding='utf-8')
          workspace = replace_once(
              workspace,
              '        var streamGeneration = 0, connected = false;\n',
              '        var streamGeneration = 0, connected = false;\n'
              '        function publishDesktopConnectionState(value) {\n'
              '            var detail = { nodeId: String(node && (node.id || node._id) || ""), connected: value === true };\n'
              '            try { window.dispatchEvent(new CustomEvent("sirkportal:desktopconnectionstate", { detail: detail })); } catch (error) {}\n'
              '            try {\n'
              '                if (window.top && window.top !== window)\n'
              '                    window.top.dispatchEvent(new window.top.CustomEvent("sirkportal:desktopconnectionstate", { detail: detail }));\n'
              '            } catch (error) {}\n'
              '        }\n'
              '        publishDesktopConnectionState(false);\n',
              'desktop connection publisher')
          workspace = replace_once(
              workspace,
              '                connected = true;\n                session.disabled = false;',
              '                connected = true;\n                publishDesktopConnectionState(true);\n                session.disabled = false;',
              'connected state publish')
          workspace = replace_once(
              workspace,
              '                connectButton.disabled = false;\n                status.textContent = error.message || String(error);',
              '                connectButton.disabled = false;\n                publishDesktopConnectionState(false);\n                status.textContent = error.message || String(error);',
              'connect failure publish')
          workspace = replace_once(
              workspace,
              '            connected = false;\n            streamGeneration += 1;',
              '            connected = false;\n            publishDesktopConnectionState(false);\n            streamGeneration += 1;',
              'disconnect state publish')
          workspace = replace_once(
              workspace,
              '                stopped = true;\n                clearInterval(statsTimer);',
              '                stopped = true;\n                publishDesktopConnectionState(false);\n                clearInterval(statsTimer);',
              'workspace teardown publish')
          workspace_path.write_text(workspace, encoding='utf-8', newline='')

          test = test_path.read_text(encoding='utf-8')
          test = replace_once(
              test,
              '        var viewMode = File.ReadAllText(Path.Combine(root, "public", "portal", "standalone", "scripts", "view-mode.js"));\n',
              '        var viewMode = File.ReadAllText(Path.Combine(root, "public", "portal", "standalone", "scripts", "view-mode.js"));\n'
              '        var workspace = File.ReadAllText(Path.Combine(root, "public", "portal", "standalone", "scripts", "device-workspace.js"));\n',
              'workspace test input')
          test = replace_once(
              test,
              '                tabsScript.Contains("data-device-tab-menu-toggle", StringComparison.Ordinal),\n            "Host tabs must expose a split close/menu control column.");',
              '                tabsScript.Contains("data-device-tab-menu-toggle", StringComparison.Ordinal) &&\n'
              '                tabsScript.Contains("data-device-tab-connect", StringComparison.Ordinal) &&\n'
              '                tabsScript.Contains("data-device-tab-disconnect", StringComparison.Ordinal) &&\n'
              '                tabsScript.Contains("TAB_ICONS.close", StringComparison.Ordinal) &&\n'
              '                tabsScript.Contains("TAB_ICONS.menu", StringComparison.Ordinal),\n'
              '            "Host tabs must expose crisp close/menu controls and direct connect/disconnect actions.");',
              'host control test')
          test = replace_once(
              test,
              '        Require(tabsCss.Contains("html.sirk-device-focus-mode #sirkPortalRoot .sirk-device-tab-actions", StringComparison.Ordinal) &&\n                tabsCss.Contains("html.sirk-device-connection-mode #sirkPortalRoot .sirk-device-tab-actions", StringComparison.Ordinal) &&\n                tabsCss.Contains("html.sirk-device-connection-mode #sirkPortalRoot .sirk-device-tab-menu-toggle{display:grid}", StringComparison.Ordinal),\n            "The lower split-menu control must appear in both expanded device modes.");',
              '        Require(tabsCss.Contains(".sirk-device-tab-connection-actions", StringComparison.Ordinal) &&\n'
              '                tabsCss.Contains(".sirk-device-tab-connect", StringComparison.Ordinal) &&\n'
              '                tabsCss.Contains(".sirk-device-tab-disconnect", StringComparison.Ordinal) &&\n'
              '                tabsCss.Contains(".sirk-device-tab-close svg", StringComparison.Ordinal) &&\n'
              '                tabsCss.Contains(".sirk-device-tab-menu-toggle svg", StringComparison.Ordinal),\n'
              '            "Host tabs must render polished SVG controls and integrated connection actions.");',
              'host control css test')
          test = replace_once(
              test,
              '        Require(tabsCss.Contains("sirk-device-tab-all", StringComparison.Ordinal) ||\n',
              '        Require(tabsScript.Contains("function requestDesktopAction", StringComparison.Ordinal) &&\n'
              '                tabsScript.Contains("sirkportal:desktopconnectionstate", StringComparison.Ordinal) &&\n'
              '                workspace.Contains("publishDesktopConnectionState(true)", StringComparison.Ordinal) &&\n'
              '                workspace.Contains("publishDesktopConnectionState(false)", StringComparison.Ordinal),\n'
              '            "Tab connection actions must drive and track the real desktop stream state.");\n'
              '        Require(tabsCss.Contains("sirk-device-tab-all", StringComparison.Ordinal) ||\n',
              'desktop state test')
          test_path.write_text(test, encoding='utf-8', newline='')

          workflow_path.unlink()
          PY
      - name: Validate Portal contracts
        shell: bash
        run: dotnet run --project tests/Sirk.Portal.ProtocolTests/Sirk.Portal.ProtocolTests.csproj --configuration Release
      - name: Commit validated host-tab controls
        shell: bash
        run: |
          git config user.name 'SIRK Automation'
          git config user.email 'sirk-automation@users.noreply.github.com'
          git add public/portal/standalone/scripts/device-tabs.js \
                  public/portal/standalone/styles/device-tabs.css \
                  public/portal/standalone/scripts/device-workspace.js \
                  tests/Sirk.Portal.ProtocolTests/DeviceHostTabSplitContract.cs \
                  .github/workflows/one-shot-stack-overlay-handles.yml
          git commit -m 'feat(ui): add polished host connection controls'
          git push origin HEAD:main
