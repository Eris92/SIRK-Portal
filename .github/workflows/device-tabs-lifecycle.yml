name: Temporary device tabs lifecycle validation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/trigger-device-tabs-lifecycle.txt

permissions:
  contents: write

jobs:
  device-tabs-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Load and apply lifecycle patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/device-tabs-lifecycle
          git show origin/fix/device-tabs-lifecycle:.github/scripts/apply-device-tabs-lifecycle.py > .github/scripts/apply-device-tabs-lifecycle.py
          python3 .github/scripts/apply-device-tabs-lifecycle.py
      - name: Validate bounded lifecycle
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq 'window.setInterval(sync, 500)' public/portal/standalone/scripts/device-tabs.js
          ! grep -Fq 'observe(document.documentElement' public/portal/standalone/scripts/device-tabs.js
          grep -Fq 'unmount: suspend' public/portal/standalone/scripts/device-tabs.js
          grep -Fq 'attributeFilter: ["data-active-view"]' public/portal/standalone/scripts/device-tabs.js
          grep -Fq 'SirkPlatformDeviceTabs.unmount' public/portal/standalone/scripts/app.js
          grep -Fq 'SirkPlatformDeviceTabs.mount' public/portal/standalone/scripts/app.js
          grep -Fq 'device-tabs-lifecycle-20260804-1' src/Sirk.Portal/Ui/PortalUiEndpoints.cs
      - name: Build publish and test .NET 10 Portal
        shell: bash
        run: bash .github/scripts/validate-node-free-dotnet10.sh
      - name: Commit final lifecycle fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/apply-device-tabs-lifecycle.py
          rm -f .github/workflows/device-tabs-lifecycle.yml
          rm -f .github/scripts/device-tabs-lifecycle-marker.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: stop device tabs background polling and release frames'
          git push origin HEAD:main
