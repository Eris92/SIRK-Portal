name: One-shot host tab card v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-host-tab-card-v2.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ contains(github.event.head_commit.message, '[run-host-tab-card-v2]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Apply host tab refinement
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/host-tab-card-v2.py
          python3 /tmp/host-tab-card-v2.py
      - name: Validate Portal contracts
        shell: bash
        run: dotnet run --project tests/Sirk.Portal.ProtocolTests/Sirk.Portal.ProtocolTests.csproj --configuration Release
      - name: Commit validated host tab refinement
        shell: bash
        run: |
          git config user.name 'SIRK Automation'
          git config user.email 'sirk-automation@users.noreply.github.com'
          git add public/portal/standalone/scripts/device-tabs.js public/portal/standalone/styles/device-tabs.css tests/Sirk.Portal.ProtocolTests/DeviceHostTabSplitContract.cs .github/workflows/one-shot-host-tab-card-v2.yml
          git commit -m 'fix(ui): refine host tab card and close on disconnect'
          git push origin HEAD:main
