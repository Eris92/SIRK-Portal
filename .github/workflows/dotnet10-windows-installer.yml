name: SIRK Portal Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - rewrite/dotnet10-clean
  pull_request:
    branches:
      - rewrite/dotnet10
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: sirk-portal-windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SIRK_TEST_FQDN: portal-ci.sirk.local
      SIRK_TEST_PORT: 9443
      SIRK_TEST_PASSWORD: Sirk-Portal-Windows-Installer-2026!
      NO_PROXY: portal-ci.sirk.local,localhost,127.0.0.1
      no_proxy: portal-ci.sirk.local,localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4

      - name: Parse installer with Windows PowerShell 5.1
        shell: powershell
        run: |
          $source = Get-Content '.\install-dotnet10.ps1' -Raw -Encoding UTF8
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseInput(
            $source,
            [ref]$tokens,
            [ref]$errors) | Out-Null
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Install SIRK Portal from zero
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:SIRK_INSTALL_FQDN = $env:SIRK_TEST_FQDN
          $env:SIRK_INSTALL_BREAKGLASS_PASSWORD = $env:SIRK_TEST_PASSWORD
          $env:SIRK_INSTALL_TRUST_CERTIFICATE = 'true'
          $source = Get-Content '.\install-dotnet10.ps1' -Raw -Encoding UTF8
          $installer = [scriptblock]::Create($source)
          & $installer `
            -NonInteractive `
            -RemoveData `
            -PortalFqdn $env:SIRK_TEST_FQDN `
            -HttpsPort ([int]$env:SIRK_TEST_PORT) `
            -TrustCertificate

      - name: Verify service certificate HTTPS UI maintenance and restore
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $baseUrl = "https://$($env:SIRK_TEST_FQDN):$($env:SIRK_TEST_PORT)"
          $dataRoot = 'C:\ProgramData\SIRK\Portal'
          $backupRoot = 'C:\ProgramData\SIRK\Portal Backups'
          $accessFile = Join-Path $dataRoot 'security\break-glass-access-code.txt'

          function Wait-PortalReady {
            param([int]$TimeoutSeconds = 120)
            $deadline = (Get-Date).AddSeconds($TimeoutSeconds)
            $lastError = $null
            do {
              try {
                $ready = Invoke-RestMethod "$baseUrl/readyz" -TimeoutSec 5
                if ($ready.status -eq 'ready') { return }
              }
              catch { $lastError = $_ }
              Start-Sleep -Seconds 2
            } while ((Get-Date) -lt $deadline)
            throw "Portal did not become ready: $lastError"
          }

          function New-PortalSession {
            if (-not (Test-Path -LiteralPath $accessFile)) { throw 'Break-Glass access code file is missing.' }
            $accessCode = (Get-Content -LiteralPath $accessFile -Raw).Trim()
            if ($accessCode.Length -lt 40) { throw 'Access Code is missing or too short.' }
            $session = New-Object Microsoft.PowerShell.Commands.WebRequestSession
            $payload = @{
              userName = 'admin'
              password = $env:SIRK_TEST_PASSWORD
              accessCode = $accessCode
            } | ConvertTo-Json -Compress
            $login = Invoke-RestMethod "$baseUrl/api/v1/auth/login" `
              -Method Post `
              -ContentType 'application/json; charset=utf-8' `
              -Body $payload `
              -WebSession $session `
              -TimeoutSec 15
            if ($login.user.role -ne 'Break-Glass') { throw 'Break-Glass login failed.' }
            return $session
          }

          function Get-CsrfHeaders {
            param([Parameter(Mandatory)][Microsoft.PowerShell.Commands.WebRequestSession]$Session)
            $csrf = Invoke-RestMethod "$baseUrl/api/v1/auth/csrf" -WebSession $Session -TimeoutSec 10
            if (-not $csrf.requestToken) { throw 'CSRF token was not issued.' }
            return @{ 'X-SIRK-CSRF' = [string]$csrf.requestToken }
          }

          function Invoke-PortalPost {
            param(
              [Parameter(Mandatory)][string]$Path,
              [Parameter(Mandatory)][object]$Body,
              [Parameter(Mandatory)][Microsoft.PowerShell.Commands.WebRequestSession]$Session,
              [Parameter(Mandatory)][hashtable]$Headers
            )
            Invoke-RestMethod ($baseUrl + $Path) `
              -Method Post `
              -ContentType 'application/json; charset=utf-8' `
              -Body ($Body | ConvertTo-Json -Depth 12 -Compress) `
              -WebSession $Session `
              -Headers $Headers `
              -TimeoutSec 30
          }

          Wait-PortalReady
          $service = Get-Service SirkPortal
          if ($service.Status -ne 'Running' -or $service.StartType -ne 'Automatic') {
            throw "Invalid service state: $($service.Status) / $($service.StartType)"
          }
          $wmi = Get-CimInstance Win32_Service -Filter "Name='SirkPortal'"
          if ($wmi.PathName -notmatch 'Sirk\.Portal\.exe') {
            throw "Invalid service command line: $($wmi.PathName)"
          }
          if (Get-ChildItem 'C:\Program Files\SIRK\Portal' -Recurse -Filter node.exe -ErrorAction SilentlyContinue) {
            throw 'Legacy Node.js runtime is present in the native installation.'
          }

          $personal = Get-ChildItem Cert:\LocalMachine\My |
            Where-Object FriendlyName -eq 'SIRK Portal HTTPS' |
            Sort-Object NotBefore -Descending |
            Select-Object -First 1
          if (-not $personal -or -not $personal.HasPrivateKey) {
            throw 'Portal certificate with private key is missing.'
          }
          $dnsNames = @($personal.DnsNameList | ForEach-Object Unicode)
          foreach ($required in @($env:SIRK_TEST_FQDN, $env:COMPUTERNAME.ToLowerInvariant(), 'localhost')) {
            if ($dnsNames -notcontains $required.ToLowerInvariant()) {
              throw "Certificate SAN is missing: $required. Actual: $($dnsNames -join ', ')"
            }
          }
          $trusted = Get-ChildItem Cert:\LocalMachine\Root |
            Where-Object Thumbprint -eq $personal.Thumbprint |
            Select-Object -First 1
          if (-not $trusted) { throw 'Portal certificate is not trusted in LocalMachine\Root.' }

          $health = Invoke-RestMethod "$baseUrl/healthz"
          $ready = Invoke-RestMethod "$baseUrl/readyz"
          if ($health.status -ne 'healthy' -or $ready.status -ne 'ready') {
            throw 'Portal health/readiness check failed.'
          }
          $loginPage = (Invoke-WebRequest "$baseUrl/login" -UseBasicParsing).Content
          foreach ($marker in @('sirk-login-page', '/assets/portal-login.css', 'name="accessCode"')) {
            if ($loginPage -notmatch [regex]::Escape($marker)) { throw "Login UI marker is missing: $marker" }
          }
          foreach ($asset in @(
            '/assets/portal-login.css',
            '/assets/portal-standalone.css',
            '/assets/standalone-core.js',
            '/assets/portal-standalone.js',
            '/assets/settings.js',
            '/assets/icons/sirk-ui.svg'
          )) {
            $response = Invoke-WebRequest ($baseUrl + $asset) -UseBasicParsing
            if ($response.StatusCode -ne 200 -or $response.RawContentLength -lt 10) {
              throw "Frontend asset failed: $asset"
            }
          }
          $settingsAsset = (Invoke-WebRequest "$baseUrl/assets/settings.js" -UseBasicParsing).Content
          foreach ($marker in @('data-portal-settings-native','/api/v1/admin/maintenance/status','"Break-Glass"')) {
            if ($settingsAsset -notmatch [regex]::Escape($marker)) { throw "Native settings marker is missing: $marker" }
          }
          if ($settingsAsset -match '/api/admin/settings' -or $settingsAsset -match 'plugin-operation') {
            throw 'Legacy settings API is active.'
          }

          $session = New-PortalSession
          $portal = (Invoke-WebRequest "$baseUrl/" -WebSession $session -UseBasicParsing).Content
          foreach ($marker in @('sirkStandaloneRoot', 'data-view="devices"', 'data-view="settings"')) {
            if ($portal -notmatch [regex]::Escape($marker)) { throw "Portal UI marker is missing: $marker" }
          }
          $settings = Invoke-RestMethod "$baseUrl/api/v1/admin/settings" -WebSession $session -TimeoutSec 10
          if (-not $settings.value.modules -or -not $settings.value.identity) { throw 'Native settings API is incomplete.' }
          $maintenance = Invoke-RestMethod "$baseUrl/api/v1/admin/maintenance/status" -WebSession $session -TimeoutSec 10
          if (-not $maintenance.value.capabilities.backup -or -not $maintenance.value.capabilities.restore) {
            throw 'Native Windows maintenance capabilities are incomplete.'
          }
          $headers = Get-CsrfHeaders -Session $session

          $backup = Invoke-PortalPost `
            -Path '/api/v1/admin/maintenance/backup' `
            -Body @{ reason = 'windows-installer-e2e' } `
            -Session $session `
            -Headers $headers
          $backupRecord = @($backup.value.backups)[0]
          if (-not $backupRecord.id) { throw 'Backup operation did not return a record.' }
          $backupPath = Join-Path $backupRoot ($backupRecord.id + '.zip')
          if (-not (Test-Path -LiteralPath $backupPath) -or (Get-Item $backupPath).Length -le 0) {
            throw "Backup archive was not created: $backupPath"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($backupPath)
          try {
            $entries = @($archive.Entries | ForEach-Object FullName)
            if ($entries -notcontains 'identity.json' -or $entries -notcontains 'settings.json') {
              throw 'Backup archive is missing critical Portal data.'
            }
            if ($entries | Where-Object { $_ -like 'backups/*' -or $_ -like '*.zip' }) {
              throw 'Backup archive recursively contains backup files.'
            }
          }
          finally { $archive.Dispose() }

          $markerPath = Join-Path $dataRoot 'restore-marker.txt'
          Set-Content -LiteralPath $markerPath -Value 'must-disappear-after-restore' -Encoding ASCII

          $null = Invoke-PortalPost `
            -Path '/api/v1/admin/maintenance/restart' `
            -Body @{} `
            -Session $session `
            -Headers $headers
          Start-Sleep -Seconds 4
          Wait-PortalReady
          if ((Get-Service SirkPortal).Status -ne 'Running') { throw 'Portal did not recover after native restart.' }

          $session = New-PortalSession
          $headers = Get-CsrfHeaders -Session $session
          $null = Invoke-PortalPost `
            -Path '/api/v1/admin/maintenance/restore' `
            -Body @{ id = $backupRecord.id } `
            -Session $session `
            -Headers $headers
          Start-Sleep -Seconds 5
          Wait-PortalReady
          if (Test-Path -LiteralPath $markerPath) {
            throw 'Restore did not replace DataRoot with the selected backup.'
          }
          if ((Get-Service SirkPortal).Status -ne 'Running') { throw 'Portal did not recover after restore.' }
          $restoredHealth = Invoke-RestMethod "$baseUrl/healthz" -TimeoutSec 10
          if ($restoredHealth.status -ne 'healthy') { throw 'Portal is unhealthy after restore.' }

          Write-Host 'SIRK Portal Windows installer HTTPS/UI/backup/restart/restore E2E: OK' -ForegroundColor Green

      - name: Show installation diagnostics on failure
        if: failure()
        shell: powershell
        run: |
          Get-Service SirkPortal -ErrorAction SilentlyContinue | Format-List *
          Get-CimInstance Win32_Service -Filter "Name='SirkPortal'" -ErrorAction SilentlyContinue | Format-List *
          Get-Content 'C:\ProgramData\SIRK\Logs\Portal-DotNet10-Install.log' -Tail 400 -ErrorAction SilentlyContinue
          Get-WinEvent -FilterHashtable @{ LogName='Application'; StartTime=(Get-Date).AddMinutes(-30) } -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -match 'Sirk|\.NET Runtime|Application Error' -or $_.Message -match 'Sirk\.Portal' } |
            Select-Object -First 100 TimeCreated,ProviderName,Id,LevelDisplayName,Message |
            Format-List

      - name: Clean Windows runner
        if: always()
        shell: powershell
        run: |
          $service = Get-Service SirkPortal -ErrorAction SilentlyContinue
          if ($service) {
            Stop-Service SirkPortal -Force -ErrorAction SilentlyContinue
            & sc.exe delete SirkPortal | Out-Null
            $global:LASTEXITCODE = 0
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              if (-not (Get-Service SirkPortal -ErrorAction SilentlyContinue)) { break }
              Start-Sleep -Seconds 1
            }
          }
          Remove-NetFirewallRule -DisplayName 'SIRK Portal HTTPS' -ErrorAction SilentlyContinue
          Get-ChildItem Cert:\LocalMachine\My,Cert:\LocalMachine\Root -ErrorAction SilentlyContinue |
            Where-Object FriendlyName -eq 'SIRK Portal HTTPS' |
            Remove-Item -Force -ErrorAction SilentlyContinue
          Remove-Item `
            'C:\Program Files\SIRK\Portal',
            'C:\ProgramData\SIRK\Portal',
            'C:\ProgramData\SIRK\Portal Backups',
            'C:\ProgramData\SIRK\Install Backups' `
            -Recurse -Force -ErrorAction SilentlyContinue
          $hosts = Join-Path $env:SystemRoot 'System32\drivers\etc\hosts'
          if (Test-Path $hosts) {
            $lines = Get-Content $hosts | Where-Object { $_ -notmatch [regex]::Escape($env:SIRK_TEST_FQDN) }
            Set-Content $hosts $lines -Encoding ASCII
          }
