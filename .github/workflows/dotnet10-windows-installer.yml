name: SIRK Portal Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - rewrite/dotnet10-clean
  pull_request:
    branches:
      - rewrite/dotnet10
      - develop
      - main

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      SIRK_TEST_FQDN: portal-ci.sirk.local
      SIRK_TEST_PORT: 9443
      SIRK_TEST_PASSWORD: Sirk-Portal-Windows-Installer-2026!
    steps:
      - uses: actions/checkout@v4

      - name: Parse installer with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\install-dotnet10.ps1'),
            [ref]$tokens,
            [ref]$errors) | Out-Null
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Install SIRK Portal from zero
        shell: powershell
        run: |
          $env:SIRK_INSTALL_FQDN = $env:SIRK_TEST_FQDN
          $env:SIRK_INSTALL_BREAKGLASS_PASSWORD = $env:SIRK_TEST_PASSWORD
          $env:SIRK_INSTALL_TRUST_CERTIFICATE = 'true'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\install-dotnet10.ps1 `
            -NonInteractive `
            -RemoveData `
            -PortalFqdn $env:SIRK_TEST_FQDN `
            -HttpsPort ([int]$env:SIRK_TEST_PORT) `
            -TrustCertificate
          if ($LASTEXITCODE -ne 0) {
            throw "Installer failed with ExitCode=$LASTEXITCODE"
          }

      - name: Verify service certificate HTTPS UI and login
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $service = Get-Service SirkPortal
          if ($service.Status -ne 'Running' -or $service.StartType -ne 'Automatic') {
            throw "Invalid service state: $($service.Status) / $($service.StartType)"
          }
          $wmi = Get-CimInstance Win32_Service -Filter "Name='SirkPortal'"
          if ($wmi.PathName -notmatch 'Sirk\.Portal\.exe') {
            throw "Invalid service command line: $($wmi.PathName)"
          }

          $personal = Get-ChildItem Cert:\LocalMachine\My |
            Where-Object FriendlyName -eq 'SIRK Portal HTTPS' |
            Sort-Object NotBefore -Descending |
            Select-Object -First 1
          if (-not $personal -or -not $personal.HasPrivateKey) {
            throw 'Portal certificate with private key is missing.'
          }
          $dnsNames = @($personal.DnsNameList | ForEach-Object Unicode)
          foreach ($required in @($env:SIRK_TEST_FQDN, $env:COMPUTERNAME.ToLowerInvariant(), 'localhost')) {
            if ($dnsNames -notcontains $required.ToLowerInvariant()) {
              throw "Certificate SAN is missing: $required. Actual: $($dnsNames -join ', ')"
            }
          }
          $trusted = Get-ChildItem Cert:\LocalMachine\Root |
            Where-Object Thumbprint -eq $personal.Thumbprint |
            Select-Object -First 1
          if (-not $trusted) { throw 'Portal certificate is not trusted in LocalMachine\Root.' }

          $baseUrl = "https://$($env:SIRK_TEST_FQDN):$($env:SIRK_TEST_PORT)"
          $health = Invoke-RestMethod "$baseUrl/healthz"
          $ready = Invoke-RestMethod "$baseUrl/readyz"
          if ($health.status -ne 'healthy' -or $ready.status -ne 'ready') {
            throw 'Portal health/readiness check failed.'
          }
          $login = (Invoke-WebRequest "$baseUrl/login" -UseBasicParsing).Content
          foreach ($marker in @('sirk-login-page', '/assets/portal-login.css', 'name="accessCode"')) {
            if ($login -notmatch [regex]::Escape($marker)) { throw "Login UI marker is missing: $marker" }
          }
          foreach ($asset in @(
            '/assets/portal-login.css',
            '/assets/portal-standalone.css',
            '/assets/standalone-core.js',
            '/assets/portal-standalone.js',
            '/assets/settings.js',
            '/assets/icons/sirk-ui.svg'
          )) {
            $response = Invoke-WebRequest ($baseUrl + $asset) -UseBasicParsing
            if ($response.StatusCode -ne 200 -or $response.RawContentLength -lt 10) {
              throw "Frontend asset failed: $asset"
            }
          }

          $accessCode = Get-Content 'C:\ProgramData\SIRK\Portal\security\break-glass-access-code.txt' -Raw
          if ($accessCode.Trim().Length -lt 40) { throw 'Access Code is missing or too short.' }
          $session = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          $payload = @{
            userName = 'admin'
            password = $env:SIRK_TEST_PASSWORD
            accessCode = $accessCode.Trim()
          } | ConvertTo-Json -Compress
          $loginResult = Invoke-RestMethod "$baseUrl/api/v1/auth/login" `
            -Method Post `
            -ContentType 'application/json' `
            -Body $payload `
            -WebSession $session
          if ($loginResult.user.role -ne 'Break-Glass') { throw 'Break-Glass login failed.' }
          $portal = (Invoke-WebRequest "$baseUrl/" -WebSession $session -UseBasicParsing).Content
          foreach ($marker in @('sirkStandaloneRoot', 'data-view="devices"', 'data-view="settings"')) {
            if ($portal -notmatch [regex]::Escape($marker)) { throw "Portal UI marker is missing: $marker" }
          }

          Restart-Service SirkPortal -Force
          (Get-Service SirkPortal).WaitForStatus('Running', [TimeSpan]::FromSeconds(60))
          $deadline = (Get-Date).AddMinutes(2)
          do {
            try {
              $ready = Invoke-RestMethod "$baseUrl/readyz" -TimeoutSec 5
              if ($ready.status -eq 'ready') { break }
            } catch {}
            Start-Sleep -Seconds 2
          } while ((Get-Date) -lt $deadline)
          if ($ready.status -ne 'ready') { throw 'Portal did not recover after service restart.' }

      - name: Show installation diagnostics on failure
        if: failure()
        shell: powershell
        run: |
          Get-Service SirkPortal -ErrorAction SilentlyContinue | Format-List *
          Get-CimInstance Win32_Service -Filter "Name='SirkPortal'" -ErrorAction SilentlyContinue | Format-List *
          Get-Content 'C:\ProgramData\SIRK\Logs\Portal-DotNet10-Install.log' -Tail 300 -ErrorAction SilentlyContinue
          Get-WinEvent -FilterHashtable @{ LogName='Application'; StartTime=(Get-Date).AddMinutes(-20) } -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -match 'Sirk|\.NET Runtime|Application Error' -or $_.Message -match 'Sirk\.Portal' } |
            Select-Object -First 50 TimeCreated,ProviderName,Id,LevelDisplayName,Message |
            Format-List

      - name: Clean Windows runner
        if: always()
        shell: powershell
        run: |
          Stop-Service SirkPortal -Force -ErrorAction SilentlyContinue
          sc.exe delete SirkPortal | Out-Null
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            if (-not (Get-Service SirkPortal -ErrorAction SilentlyContinue)) { break }
            Start-Sleep -Seconds 1
          }
          Remove-NetFirewallRule -DisplayName 'SIRK Portal HTTPS' -ErrorAction SilentlyContinue
          Get-ChildItem Cert:\LocalMachine\My,Cert:\LocalMachine\Root -ErrorAction SilentlyContinue |
            Where-Object FriendlyName -eq 'SIRK Portal HTTPS' |
            Remove-Item -Force -ErrorAction SilentlyContinue
          Remove-Item 'C:\Program Files\SIRK\Portal','C:\ProgramData\SIRK\Portal' -Recurse -Force -ErrorAction SilentlyContinue
          $hosts = Join-Path $env:SystemRoot 'System32\drivers\etc\hosts'
          if (Test-Path $hosts) {
            $lines = Get-Content $hosts | Where-Object { $_ -notmatch [regex]::Escape($env:SIRK_TEST_FQDN) }
            Set-Content $hosts $lines -Encoding ASCII
          }
