name: Apply Expanded Connection Layout Follow-up

on:
  push:
    branches:
      - fix/expanded-connection-layout
    paths:
      - .github/scripts/apply-expanded-connection-layout-followup.py
      - .github/workflows/apply-expanded-connection-layout-followup.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/expanded-connection-layout
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: preview
      - name: Apply follow-up fixes
        run: python .github/scripts/apply-expanded-connection-layout-followup.py
      - name: Validate browser JavaScript
        run: node --check public/portal/standalone/scripts/device-tabs.js
      - name: Validate .NET contracts
        run: dotnet run --project tests/Sirk.Portal.ProtocolTests/Sirk.Portal.ProtocolTests.csproj
      - name: Remove migration helpers
        run: rm -f .github/scripts/apply-expanded-connection-layout-followup.py .github/workflows/apply-expanded-connection-layout-followup.yml
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/portal/standalone/scripts/device-tabs.js \
                  public/portal/standalone/styles/device-tabs.css \
                  .github/scripts/apply-expanded-connection-layout-followup.py \
                  .github/workflows/apply-expanded-connection-layout-followup.yml
          git commit -m "fix(ui): stabilize quick commands header mount"
          git push origin HEAD:fix/expanded-connection-layout
