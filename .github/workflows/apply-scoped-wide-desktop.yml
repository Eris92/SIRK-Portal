name: Apply Scoped Wide Desktop

on:
  push:
    branches:
      - fix/scope-wide-desktop-to-devices
    paths:
      - .github/scripts/apply-scoped-wide-desktop.py
      - .github/workflows/apply-scoped-wide-desktop.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scope-wide-desktop-to-devices
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply scoped desktop fix
        run: python .github/scripts/apply-scoped-wide-desktop.py
      - name: Validate browser JavaScript
        run: |
          node --check public/portal/standalone/scripts/view-mode.js
          node --check public/portal/standalone/scripts/device-tabs.js
          node --check public/portal/standalone/scripts/device-workspace.js
      - name: Validate .NET contracts after standard desktop restore
        run: dotnet run --project tests/Sirk.Portal.ProtocolTests/Sirk.Portal.ProtocolTests.csproj --configuration Release
      - name: Remove migration helpers
        run: rm -f .github/scripts/apply-scoped-wide-desktop.py .github/workflows/apply-scoped-wide-desktop.yml
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/portal/standalone/scripts/view-mode.js \
                  tests/Sirk.Portal.ProtocolTests/CanonicalAgentManagementV1Contract.cs \
                  tests/Sirk.Portal.ProtocolTests/DeviceConnectionWorkspaceContract.cs \
                  .github/scripts/apply-scoped-wide-desktop.py \
                  .github/workflows/apply-scoped-wide-desktop.yml
          git commit -m "fix(ui): scope screen-only desktop to Devices wide mode"
          git push origin HEAD:fix/scope-wide-desktop-to-devices
