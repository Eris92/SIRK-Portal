name: Repair Desktop Screen-Only Layout

on:
  push:
    branches:
      - fix/desktop-screen-only
    paths:
      - .github/scripts/repair-desktop-screen-only.py
      - .github/workflows/repair-desktop-screen-only.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/desktop-screen-only
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Repair only the desktop workspace
        run: python .github/scripts/repair-desktop-screen-only.py

      - name: Validate browser scripts
        run: |
          node --check public/portal/standalone/scripts/device-workspace.js
          node --check public/portal/standalone/scripts/device-tabs.js
          node --check public/portal/standalone/scripts/view-mode.js

      - name: Validate workspace boundaries
        shell: bash
        run: |
          grep -n 'function renderAgentTerminal(host, node)' public/portal/standalone/scripts/device-workspace.js
          grep -n 'data-agent-terminal-command' public/portal/standalone/scripts/device-workspace.js
          grep -n 'function renderAgentFiles(host, node)' public/portal/standalone/scripts/device-workspace.js
          grep -n 'data-agent-files-path' public/portal/standalone/scripts/device-workspace.js
          grep -n 'function renderAgentDesktop(host, node)' public/portal/standalone/scripts/device-workspace.js
          grep -n 'desktopStage.appendChild(dock)' public/portal/standalone/scripts/device-workspace.js
          ! grep -n -E 'sirk-agent-desktop-controls|sirk-agent-desktop-stats|sirk-agent-desktop-admin|sirk-agent-desktop-input|sirk-agent-desktop-clipboard|sirk-agent-policy-action|sirk-command-error' \
            public/portal/standalone/scripts/device-workspace.js

      - name: Validate Portal contracts
        run: dotnet run --project tests/Sirk.Portal.ProtocolTests/Sirk.Portal.ProtocolTests.csproj --configuration Release

      - name: Remove repair helpers
        run: |
          rm .github/scripts/repair-desktop-screen-only.py
          rm .github/workflows/repair-desktop-screen-only.yml

      - name: Commit repaired product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public tests .github
          git commit -m "fix(ui): scope screen-only layout to desktop workspace"
          git push origin HEAD:fix/desktop-screen-only
