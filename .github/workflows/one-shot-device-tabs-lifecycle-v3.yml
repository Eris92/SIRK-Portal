name: Apply device tabs lifecycle v3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-device-tabs-lifecycle-v3.yml

permissions:
  contents: write

jobs:
  patch:
    if: ${{ contains(github.event.head_commit.message, '[run-device-tabs-v3]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply lifecycle fix
        run: python3 .github/scripts/device-tabs-lifecycle-v3.py

      - name: Validate JavaScript
        run: |
          node --check public/portal/standalone/scripts/device-tabs.js
          node --check public/portal/standalone/scripts/workspace-connection.js
          node --check public/portal/standalone/scripts/device-workspace.js

      - name: Validate diff
        run: git diff --check

      - name: Validate Portal contracts
        run: dotnet run --project tests/Sirk.Portal.ProtocolTests/Sirk.Portal.ProtocolTests.csproj --configuration Release

      - name: Commit validated fix
        run: |
          git config user.name "SIRK Automation"
          git config user.email "sirk-automation@users.noreply.github.com"
          git add -A
          git commit -m "fix(ui): repair device tabs lifecycle and persistent connection"
          git push origin HEAD:main

# trigger-v2
