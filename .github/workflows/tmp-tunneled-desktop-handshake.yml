name: Temporary tunneled desktop handshake validation

on:
  pull_request:
    paths:
      - '.github/triggers/tunneled-desktop-handshake.txt'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply tunneled desktop handshake fix
        run: python3 .github/scripts/apply-tunneled-desktop-handshake-fix.py

      - name: Validate desktop startup contract
        shell: bash
        run: |
          grep -F 'function portalHttpUrl(pathAndQuery)' public/portal/standalone/scripts/device-workspace.js
          grep -F 'snapshot(generation);' public/portal/standalone/scripts/device-workspace.js
          grep -F 'setTimeout(configureStream, 500);' public/portal/standalone/scripts/device-workspace.js
          grep -F 'fetch(portalHttpUrl("/api/agent-desktop/input")' public/portal/standalone/scripts/device-workspace.js
          grep -F 'portalHttpUrl("/api/agent-desktop/frame?tenantId="' public/portal/standalone/scripts/device-workspace.js
          ! grep -F 'new URL("/api/agent-operations", window.location.href)' public/portal/standalone/scripts/device-workspace.js
          ! grep -F 'fetch("/api/agent-desktop/input"' public/portal/standalone/scripts/device-workspace.js

      - name: Validate Node-free .NET 10 Portal
        run: bash .github/scripts/validate-node-free-dotnet10.sh

      - name: Commit product fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-tunneled-desktop-handshake.yml \
                 .github/scripts/apply-tunneled-desktop-handshake-fix.py
          git add public/portal/standalone/scripts/device-workspace.js
          git commit -m 'fix: start tunneled desktop without Agent handshake deadlock'
          git push origin HEAD:main
