    function enhanceSettings(){var workspace=document.querySelector("[data-portal-settings] .sirk-layout");if(!workspace)return;var secondary=workspace.querySelector(":scope > .sirk-column-secondary");if(!secondary)return;var modules=Array.prototype.find.call(secondary.querySelectorAll(":scope > details.sirk-settings-nav-group"),function(group){var summary=group.querySelector(":scope > summary");return String(summary&&summary.textContent||"").trim()==="Moduły";});var body=modules&&modules.querySelector(":scope > .sirk-settings-nav-group-body");if(!body||body.querySelector("[data-overview-settings-group]"))return;var group=document.createElement("details");group.className="sirk-settings-nav-group";group.setAttribute("data-overview-settings-group","1");var summary=document.createElement("summary");summary.textContent="Overview";var groupBody=document.createElement("div");groupBody.className="sirk-settings-nav-group-body";var button=document.createElement("button");button.type="button";button.className="sirk-nav-item sirk-settings-nav-leaf";button.textContent="Ogólne";button.onclick=function(){secondary.querySelectorAll(".sirk-nav-item.active,.sirk-nav-item.is-active").forEach(function(item){item.classList.remove("active","is-active");});button.classList.add("active");group.open=true;showOverviewSettings(workspace);};groupBody.appendChild(button);group.appendChild(summary);group.appendChild(groupBody);body.insertBefore(group,body.firstChild);}
